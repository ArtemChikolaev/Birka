name: birka_web
description: >-
  The Jaspr host of Birka for the browser: a static site with interactive
  islands on GitHub Pages.
publish_to: none
version: 0.2.0
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  accounts_common:
    path: ../../packages/features/accounts/common
  accounts_jaspr:
    path: ../../packages/features/accounts/jaspr
  ask_common:
    path: ../../packages/features/ask/common
  ask_jaspr:
    path: ../../packages/features/ask/jaspr
  backup_common:
    path: ../../packages/features/backup/common
  backup_jaspr:
    path: ../../packages/features/backup/jaspr
  bloc: ^9.2.1
  categories_common:
    path: ../../packages/features/categories/common
  categories_jaspr:
    path: ../../packages/features/categories/jaspr
  database:
    path: ../../packages/core/database
  design_jaspr:
    path: ../../packages/design/jaspr
  drift: ^2.31.0
  get_it: ^9.3.0
  help_common:
    path: ../../packages/features/help/common
  help_jaspr:
    path: ../../packages/features/help/jaspr
  http: ^1.6.0
  import_common:
    path: ../../packages/features/import/common
  import_jaspr:
    path: ../../packages/features/import/jaspr
  inbox_common:
    path: ../../packages/features/inbox/common
  inbox_jaspr:
    path: ../../packages/features/inbox/jaspr
  jaspr: ^0.22.3
  jaspr_bloc: ^1.0.1
  jaspr_router: ^0.8.1
  l10n:
    path: ../../packages/core/l10n
  ledger:
    path: ../../packages/core/ledger
  notifications_common:
    path: ../../packages/features/notifications/common
  notifications_jaspr:
    path: ../../packages/features/notifications/jaspr
  onboarding_common:
    path: ../../packages/features/onboarding/common
  onboarding_jaspr:
    path: ../../packages/features/onboarding/jaspr
  overview_common:
    path: ../../packages/features/overview/common
  overview_jaspr:
    path: ../../packages/features/overview/jaspr
  rates:
    path: ../../packages/core/rates
  reports_common:
    path: ../../packages/features/reports/common
  reports_jaspr:
    path: ../../packages/features/reports/jaspr
  schedules_common:
    path: ../../packages/features/schedules/common
  schedules_jaspr:
    path: ../../packages/features/schedules/jaspr
  settings_common:
    path: ../../packages/features/settings/common
  settings_jaspr:
    path: ../../packages/features/settings/jaspr
  sqlite3: ^2.9.4
  tags_common:
    path: ../../packages/features/tags/common
  tags_jaspr:
    path: ../../packages/features/tags/jaspr
  transactions_common:
    path: ../../packages/features/transactions/common
  transactions_jaspr:
    path: ../../packages/features/transactions/jaspr
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.22.3
  jaspr_cli: ^0.22.3
  jaspr_test: ^0.22.3
  test: ^1.26.3

jaspr:
  mode: static
