name: birka_web
description: >-
  The Jaspr host of Birka for the browser: a static site with interactive
  islands on GitHub Pages.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  accounts_common:
    path: ../../packages/features/accounts/common
  accounts_jaspr:
    path: ../../packages/features/accounts/jaspr
  bloc: ^9.2.1
  categories_common:
    path: ../../packages/features/categories/common
  categories_jaspr:
    path: ../../packages/features/categories/jaspr
  database:
    path: ../../packages/core/database
  design_jaspr:
    path: ../../packages/design/jaspr
  drift: ^2.31.0
  get_it: ^9.3.0
  jaspr: ^0.22.3
  jaspr_bloc: ^1.0.1
  jaspr_router: ^0.8.1
  l10n:
    path: ../../packages/core/l10n
  ledger:
    path: ../../packages/core/ledger
  overview_common:
    path: ../../packages/features/overview/common
  overview_jaspr:
    path: ../../packages/features/overview/jaspr
  transactions_common:
    path: ../../packages/features/transactions/common
  transactions_jaspr:
    path: ../../packages/features/transactions/jaspr
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.22.3
  jaspr_cli: ^0.22.3
  jaspr_test: ^0.22.3
  test: ^1.26.3

jaspr:
  mode: static
