name: birka_mobile
description: >-
  The Flutter host of Birka for Android and iOS, which also runs on macOS
  during development.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  design_flutter:
    path: ../../packages/design/flutter
  flutter:
    sdk: flutter
  go_router: ^17.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
