name: birka_mobile
description: >-
  The Flutter host of Birka for Android and iOS, which also runs on macOS
  during development.
publish_to: none
version: 0.2.0+1
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  accounts_common:
    path: ../../packages/features/accounts/common
  accounts_flutter:
    path: ../../packages/features/accounts/flutter
  ask_common:
    path: ../../packages/features/ask/common
  ask_flutter:
    path: ../../packages/features/ask/flutter
  backup_common:
    path: ../../packages/features/backup/common
  backup_flutter:
    path: ../../packages/features/backup/flutter
  categories_common:
    path: ../../packages/features/categories/common
