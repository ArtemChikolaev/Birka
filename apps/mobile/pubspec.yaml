name: birka_mobile
description: >-
  The Flutter host of Birka for Android and iOS, which also runs on macOS
  during development.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  accounts_common:
    path: ../../packages/features/accounts/common
  accounts_flutter:
    path: ../../packages/features/accounts/flutter
  categories_common:
    path: ../../packages/features/categories/common
  categories_flutter:
    path: ../../packages/features/categories/flutter
  database:
    path: ../../packages/core/database
  design_flutter:
    path: ../../packages/design/flutter
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^17.5.0
  l10n:
    path: ../../packages/core/l10n
  ledger:
    path: ../../packages/core/ledger

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
