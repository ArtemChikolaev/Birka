name: birka_mobile
description: >-
  The Flutter host of Birka for Android and iOS, which also runs on macOS
  during development.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  accounts_common:
    path: ../../packages/features/accounts/common
  accounts_flutter:
    path: ../../packages/features/accounts/flutter
  backup_common:
    path: ../../packages/features/backup/common
  backup_flutter:
    path: ../../packages/features/backup/flutter
  categories_common:
    path: ../../packages/features/categories/common
  categories_flutter:
    path: ../../packages/features/categories/flutter
  database:
    path: ../../packages/core/database
  design_flutter:
    path: ../../packages/design/flutter
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^17.5.0
  help_common:
    path: ../../packages/features/help/common
  help_flutter:
    path: ../../packages/features/help/flutter
  http: ^1.6.0
  import_common:
    path: ../../packages/features/import/common
  import_flutter:
    path: ../../packages/features/import/flutter
  l10n:
    path: ../../packages/core/l10n
  ledger:
    path: ../../packages/core/ledger
  onboarding_common:
    path: ../../packages/features/onboarding/common
  onboarding_flutter:
    path: ../../packages/features/onboarding/flutter
  overview_common:
    path: ../../packages/features/overview/common
  overview_flutter:
    path: ../../packages/features/overview/flutter
  rates:
    path: ../../packages/core/rates
  reports_common:
    path: ../../packages/features/reports/common
  reports_flutter:
    path: ../../packages/features/reports/flutter
  settings_common:
    path: ../../packages/features/settings/common
  settings_flutter:
    path: ../../packages/features/settings/flutter
  shared_preferences: ^2.5.5
  transactions_common:
    path: ../../packages/features/transactions/common
  transactions_flutter:
    path: ../../packages/features/transactions/flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  money:
    path: ../../packages/core/money

flutter:
  uses-material-design: true
