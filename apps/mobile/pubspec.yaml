    path: ../../packages/features/tags/flutter
  transactions_common:
    path: ../../packages/features/transactions/common
  transactions_flutter:
    path: ../../packages/features/transactions/flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  money:
    path: ../../packages/core/money

flutter:
