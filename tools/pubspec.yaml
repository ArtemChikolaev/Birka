name: birka_tools
description: >-
  Repository tooling for Birka, such as package boundary checks and a check of
  the built site in a browser.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  browser_launcher: ^1.1.3
  path: ^1.9.1
  shelf: ^1.4.3
  shelf_static: ^1.2.0
  webkit_inspection_protocol: ^1.2.1
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.26.3
