name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: make analyze

  test:
    name: Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The same core on every compiler catches int and double differences
        # between the VM and the web.
        compiler: [vm, dart2js, dart2wasm]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: make test-core COMPILER=${{ matrix.compiler }}
      - if: matrix.compiler == 'vm'
        run: make test-tools

  all-checks:
    name: All checks
    # The only check the ruleset for main requires (ADR 0004). GitHub counts a
    # skipped job as passed, so this job runs even when a job it needs fails.
    # Every new job goes into needs.
    if: always()
    needs: [analyze, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
