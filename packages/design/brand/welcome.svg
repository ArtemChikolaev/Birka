<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 300" width="390" height="300">
  <title>Birka: three glass coins with an orbit around them, for the first screen</title>
  <style>
    @font-face {
      font-family: "Manrope";
      src: url("../flutter/fonts/Manrope-Variable.ttf") format("truetype");
      font-weight: 200 800;
    }
    .letter {
      font-family: "Manrope", sans-serif;
      font-size: 335.13px;
      font-weight: 800;
    }
  </style>
  <defs>
    <linearGradient id="coin-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13704A"/>
      <stop offset="0.6" stop-color="#062E1D"/>
      <stop offset="1" stop-color="#031109"/>
    </linearGradient>
    <radialGradient id="coin-shine" cx="0.3" cy="0.24" r="1.0332">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.58" stop-color="#3DDC97" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0.4"/>
    </radialGradient>
    <clipPath id="coin-inside">
      <circle cx="516.65" cy="507.35" r="342.11"/>
    </clipPath>
    <filter id="blur-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="139.64"/>
    </filter>
    <filter id="blur-inner" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60.51"/>
    </filter>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#3DDC97" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-far" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blur-dot" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- The glows reach past the frame, so everything fades before its edge. -->
    <radialGradient id="edge-fade">
      <stop offset="0.88" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="edges">
      <ellipse cx="195" cy="150" rx="195" ry="150" fill="url(#edge-fade)"/>
    </mask>
    <!-- A far coin needs only its face: the thickness shows up close. -->
    <g id="far-coin">
      <circle cx="516.65" cy="507.35" r="349.09" fill="#0B2C1E"/>
      <circle cx="516.65" cy="507.35" r="349.09" fill="url(#coin-shine)"/>
      <circle cx="516.65" cy="507.35" r="345.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="6.98"/>
    </g>
    <!-- The coin of the app icon, without its letter. -->
    <g id="coin">
      <!-- The back of the coin, which gives it thickness. -->
      <circle cx="558.54" cy="525.97" r="349.09" fill="url(#coin-back)"/>
      <circle cx="516.65" cy="507.35" r="349.09" fill="#3DDC97" fill-opacity="0.45" filter="url(#blur-glow)"/>
      <circle cx="516.65" cy="507.35" r="349.09" fill="#0B2C1E"/>
      <circle cx="516.65" cy="507.35" r="349.09" fill="url(#coin-shine)"/>
      <g clip-path="url(#coin-inside)">
        <!-- A glow that rises from the bottom edge. -->
        <path fill="#3DDC97" fill-opacity="0.42" fill-rule="evenodd" filter="url(#blur-inner)" d="M-200 -200H1224V1224H-200Z M174.54 460.8a342.11 342.11 0 1 0 684.22 0a342.11 342.11 0 1 0 -684.22 0Z"/>
        <!-- A light line along the top edge. -->
        <path fill="#FFFFFF" fill-opacity="0.55" fill-rule="evenodd" d="M-200 -200H1224V1224H-200Z M174.54 516.66a342.11 342.11 0 1 0 684.22 0a342.11 342.11 0 1 0 -684.22 0Z"/>
      </g>
      <circle cx="516.65" cy="507.35" r="345.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="6.98"/>
      <!-- The milled edge: 56 ridges of 1.4 degrees. -->
      <circle cx="516.65" cy="507.35" r="296.27" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="49.78" pathLength="360" stroke-dasharray="1.4 5.0286" transform="rotate(-90 516.65 507.35)"/>
      <circle cx="516.65" cy="507.35" r="235.05" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4.65"/>
        </g>
  </defs>

  <g mask="url(#edges)">
  <ellipse cx="195" cy="150" rx="194" ry="149" fill="url(#halo)"/>

  <!-- The far coins, out of focus. -->
  <g transform="translate(12 2) scale(0.17)" opacity="0.5" filter="url(#blur-far)">
    <use href="#far-coin"/>
    <text class="letter" x="516" y="635" text-anchor="middle" fill="#F4FFF9">€</text>
  </g>
  <g transform="translate(219 117) scale(0.16)" opacity="0.32" filter="url(#blur-far)">
    <use href="#far-coin"/>
    <text class="letter" x="516" y="635" text-anchor="middle" fill="#F4FFF9">$</text>
  </g>

  <!-- The orbit, behind the main coin. -->
  <g fill="none" stroke="#3DDC97" transform="rotate(-9 195 150)">
    <ellipse cx="195" cy="150" rx="172" ry="62" stroke-opacity="0.34" stroke-width="1"/>
    <ellipse cx="195" cy="150" rx="132" ry="42" stroke-opacity="0.14" stroke-width="1"/>
  </g>

  <!-- The main coin. -->
  <g transform="translate(55 12) scale(0.272)">
    <use href="#coin"/>
    <text class="letter" x="516" y="635" text-anchor="middle" fill="#3DDC97" fill-opacity="0.6" filter="url(#blur-inner)">₽</text>
    <text class="letter" x="516" y="635" text-anchor="middle" fill="#F4FFF9">₽</text>
  </g>

  <!-- What runs along the orbit. -->
  <circle cx="39" cy="196" r="7" fill="#3DDC97" fill-opacity="0.5" filter="url(#blur-dot)"/>
  <circle cx="39" cy="196" r="4" fill="#3DDC97"/>
  <circle cx="345" cy="103" r="6" fill="#3DDC97" fill-opacity="0.5" filter="url(#blur-dot)"/>
  <circle cx="345" cy="103" r="3.2" fill="#3DDC97"/>
  <circle cx="268" cy="227" r="2.4" fill="#F4FFF9" fill-opacity="0.4"/>
  </g>
</svg>
