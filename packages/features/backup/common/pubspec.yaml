name: backup_common
description: >-
  The data feature of Birka in pure Dart: a copy of the ledger in a file, its
  restore, the export of operations and the wipe, shared by both hosts.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  bloc: ^9.2.1
  device_settings:
    path: ../../../core/device_settings
  get_it: ^9.3.0
  l10n:
    path: ../../../core/l10n
  ledger:
    path: ../../../core/ledger
  meta: ^1.17.0
  money:
    path: ../../../core/money

dev_dependencies:
  bloc_test: ^10.0.0
  database:
    path: ../../../core/database
  drift: ^2.31.0
  test: ^1.26.3
