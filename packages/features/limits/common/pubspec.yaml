name: limits_common
description: >-
  The monthly limits of categories in pure Dart: what each month took of them
  in any currency, the pace, and limits offered from averages, shared by both
  hosts.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  bloc: ^9.2.1
  decimal: ^3.2.6
  device_settings:
    path: ../../../core/device_settings
  get_it: ^9.3.0
  l10n:
    path: ../../../core/l10n
  ledger:
    path: ../../../core/ledger
  meta: ^1.17.0
  money:
    path: ../../../core/money
  rates:
    path: ../../../core/rates

dev_dependencies:
  database:
    path: ../../../core/database
  drift: ^2.31.0
  test: ^1.26.3
