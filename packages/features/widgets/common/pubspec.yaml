name: widgets_common
description: >-
  The widgets of the home screen in pure Dart: the page that shows them, the
  switch of their amounts and the adding of a widget from the app.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  bloc: ^9.2.1
  device_settings:
    path: ../../../core/device_settings
  get_it: ^9.3.0
  home_screen:
    path: ../../../core/home_screen
  meta: ^1.17.0

dev_dependencies:
  test: ^1.26.3
