nothingFound: "Ничего не нашлось. Напишите разработчику: ответ пригодится и другим, он появится в справке."
storageQuestion: Где хранятся мои данные?
storageAnswer: Только на этом устройстве или в этом браузере. Birka не отправляет записи на сервер и не просит пароли от банков.
moveQuestion: Как перенести учёт на другое устройство?
moveAnswer: Сохраните копию в «Ещё → Данные», перешлите файл себе и восстановите его на новом устройстве. Синхронизация появится позже.
ratesQuestion: Откуда берётся курс валют?
ratesAnswer: Это курс Банка России на день операции. Курсы обновляются раз в день и хранятся на устройстве.
importQuestion: Можно ли загрузить операции из банка?
importAnswer: Пока операции вносятся вручную. Загрузка выписок банков — следующая большая функция.
hideQuestion: Как скрыть суммы?
hideAnswer: Нажмите на глаз на Обзоре. Чтобы суммы были скрыты с самого запуска, включите «Скрывать суммы» в «Ещё».
