storageQuestion: Where is my data kept?
storageAnswer: Only on this device or in this browser. Birka sends no records to a server and never asks for bank passwords.
moveQuestion: How do I move my records to another device?
moveAnswer: Save a copy in More → Data, send the file to yourself and restore it on the new device. Sync comes later.
ratesQuestion: Where do the exchange rates come from?
ratesAnswer: They are the rates of the Bank of Russia on the day of the operation. They update once a day and stay on the device.
importQuestion: Can I load operations from my bank?
importAnswer: For now operations go in by hand. Loading bank statements is the next big feature.
hideQuestion: How do I hide the amounts?
hideAnswer: Tap the eye on Overview. To keep them hidden from the start, turn on Hide amounts in More.
