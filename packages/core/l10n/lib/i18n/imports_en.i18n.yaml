dropNote: PDFs of Sberbank only · up to 10,000 rows in one file
unreadableTitle: The file did not read
unreadable(map):
  pdf: This PDF cannot be read. Birka reads statements of Sberbank; for other banks, take CSV or Excel.
  notATable: The file holds no table of operations. It takes CSV, Excel or a PDF of Sberbank.
  damaged: The file is damaged. Download the statement again.
  empty: The file is empty.
  tooLarge: The file is too large. Take a shorter statement, up to 10,000 rows.
  incomplete: The operations of the statement miss its totals; some did not read. Download the statement again.
howTitle: How it works
how:
  - "We tell the bank by the columns of the file: Alfa-Bank, T-Bank, Sberbank, Zenmoney, Wise, Revolut or a format of your own"
  - We show every row as it will enter the ledger
  - We never double what you have already typed in
  - An import comes out whole, with one button, even a month later
privacyTitle: No bank passwords
privacyText: The file is read here, in the browser. Birka never signs in to your bank and sends the statement nowhere.
