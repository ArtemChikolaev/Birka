title: Виджеты
back: Назад
moreLine: На экране «Домой» и блокировки
moreLineAndroid: На главном экране и в ярлыках
kinds: «Сегодня» — маленький и средний, «Запись» — маленький, и два виджета для экрана блокировки
kindsAndroid: «Сегодня» — 4 × 2, «Запись» — 2 × 1
preview: Так виджет «Сегодня» выглядит сейчас
previewEmpty: Добавьте счёт, и здесь появятся цифры дня
sums: Суммы в виджетах
sumsOn: На экране блокировки суммы откроются только после Face ID.
sumsOnAndroid: Суммы видны на главном экране. Выключите, и вместо них будут точки.
sumsOff: Вместо сумм точки, кнопки работают как раньше.
howTitle: Как добавить
how:
  - Удерживайте пустое место на экране «Домой»
  - Нажмите «Изменить», затем «Добавить виджет»
  - Найдите Birka и выберите размер
howAndroid:
  - Удерживайте пустое место на главном экране
  - Нажмите «Виджеты»
  - Найдите Birka и перетащите виджет на экран
pin: Добавить на главный экран
pinNote: Android спросит, куда его поставить. Ещё можно удержать пустое место на экране и выбрать «Виджеты».
pinned: Виджет на главном экране
fasterTitle: Ещё быстрее
iconTitle: Удерживайте иконку Birka
iconText: Расход, Доход, Перевод, Спросить
