howTitle: How to add
how:
  - Touch and hold an empty spot of the Home Screen
  - Tap «Edit», then «Add Widget»
  - Find Birka and pick a size
howAndroid:
  - Touch and hold an empty spot of the home screen
  - Tap «Widgets»
  - Find Birka and drag the widget onto the screen
pin: Add to the home screen
pinNote: Android asks where to put it. You can also hold an empty spot of the screen and pick «Widgets».
pinned: The widget is on the home screen
