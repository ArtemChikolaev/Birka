name: birka_workspace
description: Workspace root for Birka. Members are listed explicitly.
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - apps/mobile
  - apps/web
  - packages/core/database
  - packages/core/device_settings
  - packages/core/l10n
  - packages/core/ledger
  - packages/core/money
  - packages/core/rates
  - packages/design/flutter
  - packages/design/jaspr
  - packages/design/tokens
  - packages/features/accounts/common
  - packages/features/accounts/flutter
  - packages/features/accounts/jaspr
  - packages/features/backup/common
  - packages/features/backup/flutter
  - packages/features/backup/jaspr
  - packages/features/categories/common
  - packages/features/categories/flutter
  - packages/features/categories/jaspr
  - packages/features/help/common
  - packages/features/help/flutter
  - packages/features/help/jaspr
  - packages/features/inbox/common
  - packages/features/inbox/jaspr
  - packages/features/import/common
  - packages/features/import/flutter
  - packages/features/import/jaspr
  - packages/features/onboarding/common
  - packages/features/onboarding/flutter
  - packages/features/onboarding/jaspr
  - packages/features/overview/common
  - packages/features/overview/flutter
  - packages/features/overview/jaspr
  - packages/features/reports/common
  - packages/features/reports/flutter
  - packages/features/reports/jaspr
  - packages/features/settings/common
  - packages/features/settings/flutter
  - packages/features/settings/jaspr
  - packages/features/transactions/common
  - packages/features/transactions/flutter
  - packages/features/transactions/jaspr
  - tools

dev_dependencies:
  very_good_analysis: ^10.1.0

# drift 2.31.0 with a fix from 2.35.1, until the Flutter upgrade (ADR 0015).
dependency_overrides:
  drift:
    path: third_party/drift
