<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бирка · Платежи до зарплаты</title>
<link rel="stylesheet" href="../../../packages/design/jaspr/lib/fonts/fonts.css">
<link rel="stylesheet" href="../../../packages/design/tokens/lib/css/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<style>
  * { box-sizing:border-box }
  body { min-height:100vh; background:radial-gradient(ellipse at top left,var(--color-ambient),transparent 65%),var(--color-background); color:var(--color-text); font-family:var(--font-family-text) }
  main { max-width:1060px; margin:auto; padding:var(--space-lg) }
  header { display:flex; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-lg) }
  header span { display:grid; place-items:center; border-radius:50%; width:var(--size-touch-target); height:var(--size-touch-target); background:var(--color-surface-raised) }
  h1,h2,p,dl,dt,dd,ul { margin:0 }
  h1,h2,b { font-family:var(--font-family-display); font-variant-numeric:tabular-nums }
  h1 { font-size:22px }
  h2 { font-size:30px; letter-spacing:-.04em }
  .layout,aside { display:grid; gap:var(--space-lg); align-items:start }
  .card,.glass { border-radius:var(--radius-lg); padding:var(--space-md) }
  .card { background:linear-gradient(150deg,var(--color-accent-soft),var(--color-surface)); border:1px solid var(--color-glass-border) }
  .period,small,dt,.setting { color:var(--color-text-muted) }
  .period { margin:var(--space-xxs) 0 var(--space-md) }
  .row,summary,li { display:flex; align-items:center; justify-content:space-between; gap:var(--space-xs) }
  .row { min-height:32px }
  summary { min-height:var(--size-touch-target); cursor:pointer; list-style:none }
  summary::-webkit-details-marker { display:none }
  summary b { margin-left:auto }
  .chevron { display:inline-block; color:var(--color-text-muted) }
  details[open] .chevron { transform:rotate(90deg) }
  ul { list-style:none; padding:0; overflow:hidden; border:1px solid var(--color-hairline); background:var(--color-surface); border-radius:var(--radius-md) }
  li { padding:var(--space-sm) var(--space-md) }
  li + li,.total { border-top:1px solid var(--color-hairline) }
  small { display:block; margin-top:var(--space-xxs) }
  b { white-space:nowrap }
  .total { margin-top:var(--space-xs); padding-top:var(--space-xs) }
  .setting { margin-bottom:var(--space-xs); font-size:14px }
  .switch { display:flex; gap:var(--space-xs) }
  button { cursor:pointer; border:1px solid var(--color-hairline); padding:var(--space-xs) var(--space-sm); border-radius:var(--radius-pill); background:transparent; color:var(--color-text-secondary); font:inherit }
  button[aria-pressed=true] { background:var(--color-accent-soft); color:var(--color-accent) }
  @media(min-width:901px) { main { padding-top:42px } .layout { grid-template-columns:minmax(0,1fr) 340px } h1 { font-size:28px } }
</style>
<main>
  <header><span aria-hidden="true">‹</span><h1>Деньги до зарплаты</h1></header>
  <div class="layout">
    <section class="card">
      <h2 id="per-day"></h2><p class="period" id="period"></p>
      <div class="row"><span>Утром на счетах</span><b>89 600 ₽</b></div>
      <details><summary><span id="label"></span><b id="paid"></b><span class="chevron" aria-hidden="true">›</span></summary><ul id="payments"></ul><button id="more" hidden>Ещё</button></details>
      <div class="row"><span>Отложить</span><b>−10 000 ₽</b></div>
      <div class="row total"><strong id="left"></strong><b id="free"></b></div>
    </section>
    <aside>
      <div class="glass"><p class="setting">Считать до</p><div class="switch"><button id="payday">Дня зарплаты</button><button id="month">Конца месяца</button></div></div>
      <div class="glass"><p class="setting">Счета в расчёте</p><div class="row"><span>Зарплатная карта</span><b>85 780 ₽</b></div><div class="row"><span>Наличные</span><b>3 200 ₽</b></div></div>
    </aside>
  </div>
</main>
<script>
  const rows = [['Аренда','25 ноября',45000],['Интернет','28 ноября',650],['Netflix','1 декабря',799],['Спортзал','3 декабря',3500]];
  const rub = value => new Intl.NumberFormat('ru').format(value).replace('-', '−') + ' ₽';
  const byId = id => document.getElementById(id);
  let visible = 20;
  let untilPayday = true;
  // The long-list sample keeps the same total, split across dated instalments.
  if (location.hash === '#many') rows.splice(0,1,...Array.from({length:30},(_,i)=>['Платёж '+(i+1),'25 ноября',1500]));
  function period(payday) {
    untilPayday = payday;
    const payments = payday ? rows : rows.filter(row => row[1].endsWith('ноября'));
    const days = payday ? 17 : 13;
    const total = payments.reduce((sum,row) => sum+row[2],0);
    const free = 89600-total-10000;
    byId('payday').setAttribute('aria-pressed',String(payday));
    byId('month').setAttribute('aria-pressed',String(!payday));
    byId('per-day').textContent = rub(Math.floor(free/days))+' в день';
    byId('period').textContent = (payday ? 'до зарплаты 5 декабря' : 'до 30 ноября')+' · '+days+' дней';
    const plural = new Intl.PluralRules('ru').select(payments.length);
    const noun = {one:'платёж',few:'платежа',many:'платежей'}[plural];
    byId('label').textContent = payments.length+' '+noun+(payday?' до зарплаты':' до конца месяца');
    byId('more').hidden = visible >= payments.length;
    byId('paid').textContent = rub(-total);
    byId('payments').innerHTML = payments.slice(0,visible).map(([name,date,amount]) => '<li><span>'+name+'<small>'+date+'</small></span><b>'+rub(-amount)+'</b></li>').join('');
    byId('left').textContent = 'Остаётся на '+days+' дней';
    byId('free').textContent = rub(free);
  }
  byId('more').onclick = () => { visible += 20; period(untilPayday); };
  document.querySelector('details').ontoggle = event => {
    if (!event.target.open) { visible = 20; period(untilPayday); }
  };
  byId('payday').onclick = () => period(true);
  byId('month').onclick = () => period(false);
  period(true);
</script>
</html>
