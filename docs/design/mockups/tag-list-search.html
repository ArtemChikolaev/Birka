<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бирка · Поиск меток и поездок</title>
<link rel="stylesheet" href="../../../packages/design/jaspr/lib/fonts/fonts.css">
<link rel="stylesheet" href="../../../packages/design/tokens/lib/css/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<style>
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; font-family: Inter,sans-serif; background: radial-gradient(ellipse at top left,var(--color-ambient),transparent 65%),var(--color-background); color: var(--color-text) }
  main { max-width: 1120px; margin: auto; padding: 20px }
  header,.field,.row { display: flex; align-items: center; gap: 12px }
  header { justify-content: space-between; margin-bottom: 18px }
  h1 { font: 750 22px Manrope,sans-serif; margin: 0 }
  .control,.badge { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50% }
  .control { background: var(--color-surface-raised); font-size: 22px }
  .badge { background: var(--color-accent-soft); color: var(--color-accent); flex: none }
  svg { width: 20px; height: 20px }
  .field { padding: 0 12px; min-height: 44px; color: var(--color-text-muted); border-radius: var(--radius-pill) }
  .field:focus-within { border-color: var(--color-accent) }
  input,button { font: inherit; color: var(--color-text); background: transparent; border: 0 }
  input { min-width: 0; flex: 1; outline: 0; font-size: 16px }
  button { cursor: pointer; color: inherit }
  h2 { font-size: 12px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .07em; margin: 20px 4px 6px }
  .group { padding: 0 14px }
  .row { min-height: 64px; padding: 10px 0 }
  .row + .row { border-top: 1px solid var(--color-hairline) }
  .name { flex: 1 }
  small,p,li { color: var(--color-text-muted); line-height: 1.5 }
  small { display: block }
  p { font-size: 13px }
  .amount { font: 750 16px Manrope,sans-serif; white-space: nowrap }
  aside { display: none }
  aside h2 { margin: 0 }
  aside ol { padding-left: 20px; margin-bottom: 0 }
  li { font-size: 14px; margin-top: 10px }
  @media (min-width: 800px) {
    main { padding-top: 44px }
    .layout { display: grid; gap: 24px; grid-template-columns: minmax(0,1fr) 420px }
    aside { display: block; align-self: start }
    header .back { display: none }
    h1 { font-size: 30px }
  }
</style>
<main>
  <header><span class="control back">‹</span><h1>Метки</h1><span class="control">+</span></header>
  <div class="layout"><div>
    <div class="glass field"><span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span><input aria-label="Найти метку или поездку" placeholder="Найти метку или поездку" value="озер"><button aria-label="Очистить поиск">×</button></div>
    <div id="results" aria-live="polite"></div>
  </div><aside class="glass"><h2>Как это устроено</h2><ol><li>Метка собирает траты поездки или проекта во всех валютах — по курсу дня.</li><li>У поездки есть даты: расходы этих дней получают её метку сами, кроме регулярных платежей.</li><li>Билеты и жильё, купленные заранее, отметьте в карточке операции.</li></ol></aside></div>
</main>
<template id="trip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7 3 3 7z"/><path d="M10 13.5 21 3"/></svg></template><template id="tag"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5v6.1a1.6 1.6 0 0 0 .47 1.13l8.3 8.3a1.6 1.6 0 0 0 2.26 0l6-6a1.6 1.6 0 0 0 0-2.26l-8.3-8.3A1.6 1.6 0 0 0 11.1 3.5H5A1.5 1.5 0 0 0 3.5 5z"/><circle cx="8" cy="8" r="1.4"/></svg></template>
<script>
  const shelves = [
    ['Сейчас', [['Озёра Карелии','День 3 из 7','24 500 ₽']]],
    ['Поездки', [['Озёрный край','3–9 августа','18 200 ₽'],['Тбилиси','3–12 ноября','63 815 ₽']]],
    ['Метки', [['Дом у озера','5 операций','9 640 ₽'],['Ремонт кухни','4 операции','12 700 ₽']]]
  ];
  const input = document.querySelector('input');
  const clear = document.querySelector('button');
  const key = value => value.trim().toLowerCase().replaceAll('ё','е');
  function render() {
    const query = key(input.value);
    clear.hidden = !input.value;
    const result = document.querySelector('#results');
    result.replaceChildren();
    for (const [shelf, tags] of shelves) {
      const matches = tags.filter(([name]) => key(name).includes(query));
      if (!matches.length) continue;
      const icon = document.querySelector(shelf === 'Метки' ? '#tag' : '#trip').innerHTML;
      const section = document.createElement('section');
      section.innerHTML = '<h2>'+shelf+'</h2><div class="glass group">'+matches.map(([name,note,amount]) =>
        '<div class="row"><span class="badge">'+icon+'</span><div class="name"><b>'+name+'</b><small>'+note+'</small></div><span class="amount">'+amount+'</span><span aria-hidden="true">›</span></div>').join('')+'</div>';
      result.append(section);
    }
    const note = document.createElement('p');
    note.textContent = result.children.length ? 'Суммы — расходы по курсу ЦБ на день каждой операции.' : 'Меток и поездок с таким названием не найдено.';
    result.append(note);
  }
  input.oninput = render;
  clear.onclick = () => { input.value = ''; render(); input.focus(); };
  render();
</script>
</html>
