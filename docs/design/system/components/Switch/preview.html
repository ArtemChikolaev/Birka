<div class="ds-stage">
  <div class="glass" style="display:flex;flex-direction:column;gap:var(--space-sm);flex:1 1 280px">
    <label style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm)"><span class="text-body">Face ID at launch</span><button class="birka-switch birka-switch--on" role="switch" aria-checked="true"><span class="birka-switch__thumb"></span></button></label>
    <div class="birka-rule"></div>
    <label style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm)"><span class="text-body">Hide amounts at launch</span><button class="birka-switch" role="switch" aria-checked="false"><span class="birka-switch__thumb"></span></button></label>
  </div>
</div>
