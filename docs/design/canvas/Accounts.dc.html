<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Счета</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(64% 20% at 0% 66%, rgba(36,138,86,0.24) 0%, transparent 72%), #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 28px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #F4F4F2; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <button type="button" aria-label="Добавить счёт" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #F4F4F2; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>

  <div>
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Счета</h1>
    <div style="margin-top: 4px; font-size: 14px; color: #A3A3A3">Капитал <strong style="color: #F4F4F2; font-variant-numeric: tabular-nums">1 284 560 ₽</strong> в 4 счетах и 2 валютах</div>
  </div>

  <div aria-live="polite" style="position: relative; height: 196px; box-sizing: border-box; padding: 20px; border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); background: {{sel.art}}; background-clip: padding-box; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 18px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{sel.name}}</div>
        <div style="margin-top: 2px; font-size: 13px; color: #D6D6D4">{{sel.sub}}</div>
      </div>
      <div aria-hidden="true" style="width: 36px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.18)); border: 1px solid rgba(255,255,255,0.35)"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <div style="font-family: Manrope, Inter, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{sel.balance}}</div>
        <div style="margin-top: 2px; font-size: 13px; color: #D6D6D4; font-variant-numeric: tabular-nums">{{sel.note}}</div>
      </div>
      <div aria-hidden="true" style="width: 74px; height: 18px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.32) 0 2px, transparent 2px 8px)"></div>
    </div>
  </div>

  <div style="border-radius: 22px; padding: 4px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%)">
    <sc-for list="{{accounts}}" as="a" hint-placeholder-count="4">
      <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 62px; background: none; border: 0; border-bottom: {{a.divider}}; padding: 0; color: #F4F4F2; font: inherit; text-align: left; cursor: pointer">
        <span aria-hidden="true" style="flex: 0 0 46px; height: 32px; border-radius: 8px; border: 1px solid {{a.ring}}; background: {{a.art}}; background-clip: padding-box"></span>
        <span style="flex: 1 1 auto; min-width: 0">
          <span style="display: block; font-weight: 600">{{a.name}}</span>
          <span style="display: block; font-size: 13px; color: #A3A3A3">{{a.sub}}</span>
        </span>
        <span style="text-align: right; font-variant-numeric: tabular-nums">
          <span style="display: block; font-weight: 700; white-space: nowrap">{{a.balance}}</span>
          <span style="display: block; font-size: 12px; color: #A3A3A3; white-space: nowrap">{{a.base}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="border-radius: 22px; padding: 16px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%)">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Цель · Подушка</div>
      <div style="font-size: 13px; color: #A3A3A3; font-variant-numeric: tabular-nums"><strong style="color: #F4F4F2">640 000</strong> из 1 000 000 ₽</div>
    </div>
    <div role="img" aria-label="Накоплено 64% цели" style="margin-top: 12px; height: 14px; border-radius: 4px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 6px, transparent 6px 9px); position: relative; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 64%; background: repeating-linear-gradient(90deg, #3DDC97 0 6px, transparent 6px 9px); box-shadow: 0 0 14px rgba(61,220,151,0.35)"></div>
    </div>
    <div style="margin-top: 10px; font-size: 13px; color: #C9C9C7">Ещё 360 000 ₽ — при текущем темпе к марту</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: 'salary' };
  }

  renderVals() {
    const list = [
      { id: 'salary', name: 'Зарплатная', sub: 'Рубли · •• 4568', balance: '412 300 ₽', base: 'основной', note: '+210 000 ₽ в октябре', art: 'radial-gradient(120% 130% at 100% 100%, rgba(30,150,92,0.85) 0%, rgba(14,70,44,0.55) 38%, transparent 66%), radial-gradient(70% 80% at 0% 0%, rgba(120,214,166,0.20) 0%, transparent 60%), linear-gradient(135deg, #0A1A12 0%, #030504 100%)' },
      { id: 'savings', name: 'Накопления', sub: 'Рубли · вклад 16%', balance: '640 000 ₽', base: 'цель 1 000 000 ₽', note: '+8 400 ₽ процентами в октябре', art: 'linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.10) 50%, transparent 62%), linear-gradient(150deg, #38383B 0%, #19191B 40%, #0A0A0B 100%)' },
      { id: 'euro', name: 'Евро-счёт', sub: 'Евро · •• 1207', balance: '2 140 €', base: '≈ 213 760 ₽', note: '≈ 213 760 ₽ по курсу 99,89', art: 'radial-gradient(120% 130% at 100% 100%, rgba(40,118,150,0.80) 0%, rgba(16,56,74,0.5) 40%, transparent 68%), linear-gradient(135deg, #07141A 0%, #030607 100%)' },
      { id: 'cash', name: 'Наличные', sub: 'Рубли', balance: '18 500 ₽', base: 'в кошельке', note: 'сверено вчера', art: 'radial-gradient(120% 130% at 0% 0%, rgba(178,122,40,0.55) 0%, transparent 62%), linear-gradient(135deg, #18110A 0%, #050403 100%)' }
    ];
    const selected = this.state.selected;
    const sel = list.find((a) => a.id === selected) ?? list[0];
    return {
      sel,
      accounts: list.map((a, i) => ({
        ...a,
        pick: () => this.setState({ selected: a.id }),
        pressed: a.id === selected ? 'true' : 'false',
        ring: a.id === selected ? '#3DDC97' : 'rgba(255,255,255,0.16)',
        divider: i < list.length - 1 ? '1px solid rgba(255,255,255,0.06)' : '0'
      }))
    };
  }
}
</script>
</body>
</html>
