<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Уведомления · срок долга</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(60% 20% at 0% 55%, rgba(36,138,86,0.18) 0%, transparent 72%), #000000">
  <div style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none">
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 48px">
      <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px">
        <a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F4F4F2; text-decoration: none; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
        <h1 style="margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Уведомления</h1>
        <span aria-hidden="true"></span>
      </div>

      <div role="tablist" aria-label="Чьи уведомления" style="display: flex; gap: 6px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button type="button" role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="flex: 0 0 auto; height: 34px; padding: 0 10px; border-radius: 17px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 200ms ease, color 200ms ease">{{f.label}}</button>
        </sc-for>
      </div>

      <section aria-label="Новые" style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px">
          <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3; padding: 0; color: #C9C9C7">Новые · {{freshCount}}</h2>
          <span style="color: #3DDC97; font-size: 14px; font-weight: 600">Прочитать все</span>
        </div>
        <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
          <sc-for list="{{fresh}}" as="n" hint-placeholder-count="2">
            <a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-bottom: {{n.divider}}; color: #F4F4F2; text-decoration: none">
              <span aria-hidden="true" style="flex: 0 0 8px; height: 8px; border-radius: 4px; background: #3DDC97; box-shadow: 0 0 8px rgba(61,220,151,0.70)"></span>
              <span aria-hidden="true" style="flex: 0 0 36px; height: 36px; border-radius: 12px; background: {{n.tileBg}}; color: {{n.tileInk}}; display: grid">
                <span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{n.debtO}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.2 19.5c0-3.3 2.6-5.6 5.8-5.6s5.8 2.3 5.8 5.6"></path><path d="M15.6 4.9a3 3 0 0 1 0 6"></path><path d="M17.4 14.2c2 .6 3.4 2.6 3.4 5.3"></path></svg></span>
                <span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{n.payO}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17"></path><path d="M8 3v4M16 3v4"></path></svg></span>
              </span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span><span style="font-size: 13px; color: #C9C9C7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.line}}</span></span>
              <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #3DDC97; white-space: nowrap">{{n.time}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px"><path d="M9 6l6 6-6 6"></path></svg></span>
            </a>
          </sc-for>
        </div>
      </section>

      <section aria-label="Вчера" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3; color: #C9C9C7">1 ноября</h2>
        <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; box-sizing: border-box; padding: 12px 0">
            <span aria-hidden="true" style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; background: rgba(251,113,133,0.16); color: #FB7185; display: flex; align-items: center; justify-content: center; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 15px">И</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Срок · Ира, 1 500 ₽</span><span style="font-size: 13px; color: #3DDC97">Вернули 2 ноября</span></span>
            <span style="flex: 0 0 auto; font-size: 12px; font-weight: 600; color: #8A8A8A">9:00</span>
          </div>
        </div>
      </section>
      <span style="align-self: center; font-size: 12px; color: #8A8A8A">Birka хранит уведомления 90 дней</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
    this.lines = {};
    this.timers = [];
    this.box = null;
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  renderVals() {
    // The debt of Дима is due today: the notice came at 9:00 and leads to
    // the card of the debt. The chip «Долги» shows only these notices.
    const filter = this.state.filter;
    const fresh = [
      { kind: 'debt', title: 'Срок сегодня · Дима, 120 $', line: 'За квартиру в Тбилиси · с 20 октября', time: '9:00', href: 'Debt-Person.dc.html' },
      { kind: 'pay', title: 'Аренда · 45 000 ₽', line: 'Сегодня, ждёт подтверждения', time: '9:00', href: '#' }
    ].filter((n) => filter === 'all' || filter === n.kind);
    const tiles = { debt: ['rgba(251,191,36,0.16)', '#FBBF24'], pay: ['rgba(251,191,36,0.16)', '#FBBF24'] };
    return {
      freshCount: String(fresh.length),
      fresh: fresh.map((n, i) => ({
        ...n,
        tileBg: tiles[n.kind][0],
        tileInk: tiles[n.kind][1],
        debtO: n.kind === 'debt' ? '1' : '0',
        payO: n.kind === 'pay' ? '1' : '0',
        divider: i < fresh.length - 1 ? '1px solid rgba(255,255,255,0.08)' : '0'
      })),
      filters: [['all', 'Все'], ['pay', 'Платежи'], ['debt', 'Долги'], ['import', 'Импорт'], ['birka', 'Birka']].map(([id, label]) => ({
        label,
        selected: filter === id ? 'true' : 'false',
        bg: filter === id ? '#F4F4F2' : 'rgba(255,255,255,0.07)',
        fg: filter === id ? '#000000' : '#C9C9C7',
        pick: () => this.setState({ filter: id })
      }))
    };
  }
}
</script>
</body>
</html>
