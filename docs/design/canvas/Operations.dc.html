<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Операции</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A8A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(64% 20% at 0% 62%, rgba(36,138,86,0.26) 0%, transparent 72%), #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px">
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 130px">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Операции</h1>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #F4F4F2; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v18M8 3l-4 4M8 3l4 4M16 21V3M16 21l-4-4M16 21l4-4"></path></svg>
        Октябрь
      </button>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" aria-label="Поиск по операциям" placeholder="Кафе, 250, получатель или тег" style="flex: 1 1 auto; min-width: 0; background: none; border: 0; outline: none; color: #F4F4F2; font: inherit; font-size: 15px">
    </label>

    <div role="group" aria-label="Тип операций" style="display: flex; gap: 6px">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
        <button type="button" onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: {{k.bg}}; color: {{k.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{k.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 14px; font-size: 13px; color: #A3A3A3; font-variant-numeric: tabular-nums">
      <span>Расходы <strong style="color: #F4F4F2">−86 420 ₽</strong></span>
      <span>Доходы <strong style="color: #3DDC97">+210 000 ₽</strong></span>
    </div>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <section aria-label="{{d.label}}" style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
          <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F4F4F2">{{d.label}}</h2>
          <span style="font-size: 13px; font-weight: 600; color: #A3A3A3; font-variant-numeric: tabular-nums">{{d.total}}</span>
        </div>
        <div style="border-radius: 22px; padding: 4px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); overflow: hidden">
          <sc-for list="{{d.rows}}" as="t" hint-placeholder-count="2">
            <div style="position: relative; display: flex; align-items: center; min-height: 60px; border-bottom: {{t.divider}}">
              <button type="button" onClick="{{t.toggle}}" aria-label="{{t.title}}, {{t.amount}}" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 60px; background: none; border: 0; padding: 0; color: #F4F4F2; font: inherit; text-align: left; cursor: pointer; transform: translateX({{t.shift}}); transition: transform 320ms cubic-bezier(0.34, 1.4, 0.64, 1)">
                <span aria-hidden="true" style="flex: 0 0 40px; height: 40px; border-radius: 13px; background: {{t.tint}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center">
                  <sc-if value="{{t.isCafe}}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M8 3v2M12 3v2"></path></svg></sc-if>
                  <sc-if value="{{t.isFood}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2"></path><circle cx="9" cy="19" r="1.5"></circle><circle cx="17" cy="19" r="1.5"></circle></svg></sc-if>
                  <sc-if value="{{t.isTransport}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 11h14M8 20v-3M16 20v-3"></path></svg></sc-if>
                  <sc-if value="{{t.isHome}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></sc-if>
                  <sc-if value="{{t.isSubs}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path></svg></sc-if>
                  <sc-if value="{{t.isTransfer}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"></path></svg></sc-if>
                  <sc-if value="{{t.isIncome}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M8 10l4 4 4-4"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg></sc-if>
                </span>
                <span style="flex: 1 1 auto; min-width: 0">
                  <span style="display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
                  <span style="display: block; font-size: 13px; color: #A3A3A3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.meta}}</span>
                </span>
                <span style="font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: {{t.color}}">{{t.amount}}</span>
              </button>
              <sc-if value="{{t.swiped}}" hint-placeholder-val="{{ false }}">
                <div style="position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: center; gap: 6px">
                  <a href="QuickAdd.dc.html" aria-label="Дублировать" style="width: 60px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.10); color: #F4F4F2; display: flex; align-items: center; justify-content: center">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
                  </a>
                  <button type="button" onClick="{{t.toggle}}" aria-label="Удалить" style="width: 60px; height: 44px; border-radius: 14px; border: 0; background: rgba(255,142,127,0.18); color: #FF8E7F; display: flex; align-items: center; justify-content: center; cursor: pointer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
                  </button>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <a href="Transaction.dc.html" style="align-self: center; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3; text-decoration: none">Открыть операцию →</a>
  </div>

  <nav aria-label="Разделы" style="position: absolute; left: 32px; right: 32px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 5px; border-radius: 32px; background: rgba(32,32,34,0.52); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 12px 32px rgba(0,0,0,0.55); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <div aria-hidden="true" style="position: absolute; top: 5px; bottom: 5px; left: 67.8px; width: 62.8px; border-radius: 26px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28)"></div>
    <a href="Main.dc.html" style="position: relative; height: 52px; color: #B4B4B2; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Обзор</a>
    <a href="Operations.dc.html" aria-current="page" style="position: relative; height: 52px; color: #3DDC97; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>Операции</a>
    <a href="QuickAdd.dc.html" aria-label="Новая операция" style="justify-self: center; position: relative; width: 50px; height: 50px; border-radius: 25px; background: #3DDC97; color: #02130B; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 22px rgba(36,138,86,0.55)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Reports.dc.html" style="position: relative; height: 52px; color: #B4B4B2; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Отчёты</a>
    <a href="More.dc.html" style="position: relative; height: 52px; color: #B4B4B2; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg>Ещё</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'all', swiped: 't1' };
  }

  renderVals() {
    const look = {
      cafe: ['rgba(251,191,36,0.14)', '#FBBF24'],
      food: ['rgba(74,222,128,0.14)', '#4ADE80'],
      transport: ['rgba(96,165,250,0.14)', '#60A5FA'],
      home: ['rgba(167,139,250,0.14)', '#A78BFA'],
      subs: ['rgba(34,211,238,0.14)', '#22D3EE'],
      transfer: ['rgba(255,255,255,0.08)', '#D6D6D4'],
      income: ['rgba(61,220,151,0.14)', '#3DDC97']
    };
    const data = [
      { label: 'Сегодня', rows: [
        ['t1', 'cafe', 'Кофейня у дома', 'Кафе · Зарплатная', -250],
        ['t2', 'transport', 'Метро', 'Транспорт · Зарплатная', -130],
        ['t3', 'food', 'Супермаркет', 'Продукты · Зарплатная', -2300]
      ] },
      { label: 'Вчера', rows: [
        ['t4', 'food', 'Рынок', 'Продукты · Наличные', -1240],
        ['t5', 'subs', 'Стриминг музыки', 'Подписки · Зарплатная', -199],
        ['t6', 'home', 'Интернет и связь', 'Дом · Зарплатная', -2471]
      ] },
      { label: '28 октября', rows: [
        ['t7', 'transfer', 'На накопления', 'Перевод · Зарплатная → Накопления', 20000]
      ] },
      { label: '25 октября', rows: [
        ['t8', 'income', 'Зарплата', 'Доход · Зарплатная', 210000]
      ] }
    ];
    const { kind, swiped } = this.state;
    const kindOf = (cat) => (cat === 'income' ? 'income' : cat === 'transfer' ? 'transfer' : 'expense');
    const money = (v) => Math.abs(v).toLocaleString('ru-RU') + ' ₽';
    const days = [];
    for (const day of data) {
      const rows = day.rows.filter((r) => kind === 'all' || kindOf(r[1]) === kind);
      if (rows.length === 0) continue;
      const spent = rows.filter((r) => kindOf(r[1]) === 'expense').reduce((sum, r) => sum + r[4], 0);
      days.push({
        label: day.label,
        total: spent < 0 ? '−' + money(spent) : '',
        rows: rows.map(([id, cat, title, meta, value], i) => {
          const k = kindOf(cat);
          const amount = k === 'expense' ? '−' + money(value) : k === 'income' ? '+' + money(value) : money(value);
          return {
            title,
            meta,
            amount,
            color: k === 'income' ? '#3DDC97' : k === 'transfer' ? '#A3A3A3' : '#F4F4F2',
            tint: look[cat][0],
            ink: look[cat][1],
            isCafe: cat === 'cafe',
            isFood: cat === 'food',
            isTransport: cat === 'transport',
            isHome: cat === 'home',
            isSubs: cat === 'subs',
            isTransfer: cat === 'transfer',
            isIncome: cat === 'income',
            swiped: swiped === id,
            shift: swiped === id ? '-136px' : '0px',
            divider: i < rows.length - 1 ? '1px solid rgba(255,255,255,0.06)' : '0',
            toggle: () => this.setState({ swiped: swiped === id ? null : id })
          };
        })
      });
    }
    const kinds = [['all', 'Все'], ['expense', 'Расходы'], ['income', 'Доходы'], ['transfer', 'Переводы']].map(([id, label]) => ({
      label,
      pick: () => this.setState({ kind: id }),
      pressed: kind === id ? 'true' : 'false',
      bg: kind === id ? '#F4F4F2' : 'rgba(255,255,255,0.07)',
      fg: kind === id ? '#000000' : '#C9C9C7'
    }));
    return { days, kinds };
  }
}
</script>
</body>
</html>
