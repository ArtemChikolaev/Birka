</helmet>
<div style="width: 1100px; height: 560px; box-sizing: border-box; background: radial-gradient(40% 50% at 0% 0%, rgba(36,138,86,0.22) 0%, transparent 74%), radial-gradient(44% 54% at 100% 100%, rgba(36,138,86,0.22) 0%, transparent 74%), #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 120px">

  <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 24px">

      <div style="position: absolute; left: 36px; top: 34px; width: 150px; height: 150px; transform: perspective(700px) rotateY(-14deg) rotateX(8deg)">
        <div style="position: absolute; inset: 0; border-radius: 50%; transform: translate(9px, 4px); background: linear-gradient(135deg, #13704A 0%, #062E1D 60%, #031109 100%)"></div>
        <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 24%, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.12) 30%, rgba(61,220,151,0.14) 58%, rgba(61,220,151,0.40) 100%), #0B2C1E; border: 1.5px solid rgba(255,255,255,0.42); box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), inset 0 -10px 26px rgba(61,220,151,0.42), 0 0 60px rgba(61,220,151,0.45)"></div>
        <div style="position: absolute; inset: 6px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,0.45) 0deg 1.4deg, transparent 1.4deg 6.5deg); -webkit-mask-image: radial-gradient(closest-side, transparent 84%, #000 85%); mask-image: radial-gradient(closest-side, transparent 84%, #000 85%)"></div>
        <div style="position: absolute; inset: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.26)"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Manrope, Inter, sans-serif; font-size: 72px; font-weight: 800; letter-spacing: -0.04em; color: #F4FFF9; text-shadow: 0 0 22px rgba(61,220,151,0.8)">B</div>
      </div>
    </div>
    <figcaption style="font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #3DDC97; box-shadow: 0 0 10px #3DDC97"></span>Монета · выбрано</figcaption>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 24px">
    <div role="img" aria-label="Иконка: буква B, собранная из стебля и двух половинок монет" style="position: relative; width: 220px; height: 220px; border-radius: 52px; overflow: hidden; background: radial-gradient(70% 60% at 80% 20%, rgba(36,138,86,0.40) 0%, transparent 70%), #020604; box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 28px 60px rgba(0,0,0,0.65)">
      <div aria-hidden="true" style="position: absolute; left: 40px; top: 40px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(closest-side, rgba(61,220,151,0.30), transparent)"></div>

      <div style="position: absolute; left: 74px; top: 110px; width: 98px; height: 72px; border-radius: 0 36px 36px 0; background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.58) 0%, rgba(255,255,255,0.10) 34%, rgba(61,220,151,0.30) 66%, #0E5A3A 100%); border: 1.5px solid rgba(255,255,255,0.40); border-left: 0; box-shadow: inset 0 -8px 18px rgba(61,220,151,0.40), 0 0 30px rgba(61,220,151,0.30)"></div>
      <div aria-hidden="true" style="position: absolute; left: 150px; top: 46px; width: 8px; height: 54px; background: repeating-linear-gradient(180deg, rgba(255,255,255,0.45) 0 2px, transparent 2px 6px); border-radius: 4px; opacity: 0.8"></div>
      <div aria-hidden="true" style="position: absolute; left: 162px; top: 118px; width: 8px; height: 56px; background: repeating-linear-gradient(180deg, rgba(255,255,255,0.45) 0 2px, transparent 2px 6px); border-radius: 4px; opacity: 0.8"></div>
    </div>
    <figcaption style="font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 700; color: #8A8A8A">B из монет</figcaption>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 24px">
    <div role="img" aria-label="Иконка: стопка из трёх стеклянных монет с рифлёными боками" style="position: relative; width: 220px; height: 220px; border-radius: 52px; overflow: hidden; background: radial-gradient(70% 55% at 50% 30%, rgba(36,138,86,0.45) 0%, transparent 72%), #020604; box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 28px 60px rgba(0,0,0,0.65)">
      <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true" style="position: absolute; inset: 0">
        <defs>
          <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#062E1D"></stop>
            <stop offset="0.45" stop-color="#2BB57A"></stop>
            <stop offset="0.6" stop-color="#7CF0BE"></stop>
            <stop offset="1" stop-color="#062E1D"></stop>
          </linearGradient>
          <radialGradient id="face" cx="0.36" cy="0.32" r="0.85">
            <stop offset="0" stop-color="#E6FFF3"></stop>
            <stop offset="0.3" stop-color="#7CF0BE"></stop>
            <stop offset="0.7" stop-color="#1E8A57"></stop>
            <stop offset="1" stop-color="#0B3A26"></stop>
          </radialGradient>
          <pattern id="mill" width="6" height="20" patternUnits="userSpaceOnUse">
            <rect width="2" height="20" fill="rgba(0,0,0,0.30)"></rect>
          </pattern>
        </defs>
        <g>
          <rect x="44" y="150" width="128" height="20" fill="url(#side)"></rect>
          <rect x="44" y="150" width="128" height="20" fill="url(#mill)"></rect>
          <ellipse cx="108" cy="170" rx="64" ry="17" fill="url(#side)"></ellipse>
          <ellipse cx="108" cy="150" rx="64" ry="17" fill="url(#face)"></ellipse>
        </g>
        <g>
          <rect x="40" y="122" width="128" height="20" fill="url(#side)"></rect>
          <rect x="40" y="122" width="128" height="20" fill="url(#mill)"></rect>
          <ellipse cx="104" cy="142" rx="64" ry="17" fill="url(#side)"></ellipse>
          <ellipse cx="104" cy="122" rx="64" ry="17" fill="url(#face)"></ellipse>
        </g>
        <g>
          <rect x="50" y="94" width="128" height="20" fill="url(#side)"></rect>
          <rect x="50" y="94" width="128" height="20" fill="url(#mill)"></rect>
          <ellipse cx="114" cy="114" rx="64" ry="17" fill="url(#side)"></ellipse>
          <ellipse cx="114" cy="94" rx="64" ry="17" fill="url(#face)"></ellipse>
          <ellipse cx="114" cy="94" rx="46" ry="11.5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"></ellipse>
        </g>
        <ellipse cx="96" cy="70" rx="40" ry="10" fill="rgba(61,220,151,0.20)"></ellipse>
      </svg>
    </div>
    <figcaption style="font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 700; color: #8A8A8A">Стопка</figcaption>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":560}}'>
