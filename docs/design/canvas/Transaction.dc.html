<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Детали операции</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(70% 30% at 50% 14%, rgba(251,191,36,0.10) 0%, transparent 72%), radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.26) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 28px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Operations.dc.html" aria-label="Назад к операциям" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #F4F4F2; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Операция</span>
    <a href="QuickAdd.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #F4F4F2; text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center">Изменить</a>
  </div>

  <section aria-label="Сумма" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px">
    <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 22px; background: rgba(251,191,36,0.16); border: 1px solid rgba(251,191,36,0.30); color: #FBBF24; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(251,191,36,0.18)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M8 3v2M12 3v2"></path></svg>
    </span>
    <div style="font-family: Manrope, Inter, sans-serif; font-size: 46px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em; font-variant-numeric: tabular-nums">−250 ₽</div>
    <div style="font-size: 17px; font-weight: 600">Кофейня у дома</div>
    <div style="display: flex; gap: 6px; align-items: center; font-size: 13px; color: #A3A3A3">
      Сегодня, 08:42
      <span aria-hidden="true">·</span>
      <span style="height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(255,255,255,0.08); color: #D6D6D4; display: inline-flex; align-items: center; font-weight: 600">Вручную</span>
    </div>
  </section>

  <div style="border-radius: 22px; padding: 4px 16px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%)">
    <sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: {{f.divider}}">
        <span style="font-size: 14px; color: #A3A3A3">{{f.label}}</span>
        <span style="display: flex; align-items: center; gap: 8px; font-weight: 600; text-align: right">
          <sc-if value="{{f.hasDot}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{f.dot}}"></span></sc-if>
          {{f.value}}
        </span>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px">
      <span style="font-size: 14px; color: #A3A3A3">Теги</span>
      <span style="display: flex; gap: 6px">
        <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.08); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">#утро</span>
        <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.08); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">#по-пути</span>
      </span>
    </div>
  </div>

  <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 22px; background: linear-gradient(160deg, rgba(61,220,151,0.12) 0%, rgba(61,220,151,0.03) 100%); border: 1px solid rgba(61,220,151,0.24); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px)">
    <span aria-hidden="true" style="flex: 0 0 36px; height: 36px; border-radius: 12px; background: rgba(61,220,151,0.16); color: #3DDC97; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l1.9 4.9L19 10l-5.1 2.1L12 17l-1.9-4.9L5 10l5.1-2.1z"></path></svg>
    </span>
    <span style="flex: 1 1 auto">
      <span style="display: block; font-weight: 700">Почему «Кафе»</span>
      <span style="display: block; margin-top: 2px; font-size: 13px; color: #C9C9C7; line-height: 1.4">Правило: получатель содержит «Кофейня». Сработало 14 раз. В этом месяце здесь 9 покупок на 2 250 ₽.</span>
    </span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: auto">
    <a href="QuickAdd.dc.html" style="height: 76px; border-radius: 20px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #F4F4F2; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
      Повторить
    </a>
    <button type="button" style="height: 76px; border-radius: 20px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #F4F4F2; font: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 6 6h0M18 4v6a6 6 0 0 1-6 6M12 16v4"></path></svg>
      Разделить
    </button>
    <a href="Operations.dc.html" style="height: 76px; border-radius: 20px; background: rgba(255,142,127,0.12); border: 1px solid rgba(255,142,127,0.26); color: #FF8E7F; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
      Удалить
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Счёт', 'Зарплатная · •• 4568', null],
      ['Категория', 'Кафе', '#FBBF24'],
      ['Дата', '30 октября 2026', null],
      ['Заметка', 'Капучино и круассан', null]
    ];
    return {
      fields: rows.map(([label, value, dot]) => ({
        label,
        value,
        hasDot: Boolean(dot),
        dot: dot ?? 'transparent',
        divider: '1px solid rgba(255,255,255,0.06)'
      }))
    };
  }
}
</script>
</body>
</html>
