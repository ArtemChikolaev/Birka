      <div style="display: flex; align-items: center; gap: 10px; height: 48px; border-bottom: 1px solid rgba(255,255,255,0.06)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #6EA8FE"></span><span style="flex: 1 1 auto; font-weight: 600">Продукты</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">10 800 ₽</span><span style="width: 44px; text-align: right; color: #A3A3A3; font-variant-numeric: tabular-nums">48%</span></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; border-bottom: 1px solid rgba(255,255,255,0.06)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F2B533"></span><span style="flex: 1 1 auto; font-weight: 600">Кафе</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">5 200 ₽</span><span style="width: 44px; text-align: right; color: #A3A3A3; font-variant-numeric: tabular-nums">23%</span></div>

<script type="text/x-dc" data-dc-script data-props='{"slow":{"editor":"boolean","default":false},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'nov' };
    this.timer = null;
    this.start = 0;
    this.slowSeen = null;
    this.stopped = false;
  }

  componentDidMount() {
    this.stopped = false;
    this.clock();
  }

  componentDidUpdate() {
    this.clock();
  }

  componentWillUnmount() {
    this.stopped = true;
    clearTimeout(this.timer);
    this.timer = null;
  }

  steps() {
    return [['nov', 1500, 820], ['grabPrev', 80, 140], ['swipePrev', 0, 360], ['oct', 1700, 820], ['grabNext', 80, 140], ['swipeNext', 0, 360]];
  }

  active() {
    return !this.stopped && (!this.__host || this.__host.logic === this);
  }

  phaseAt(elapsed) {
    const k = this.props.slow ? 3 : 1;
    const steps = this.steps();
    const total = steps.reduce((sum, s) => sum + s[1] + s[2] * k, 0);
    let t = elapsed % total;
    for (const s of steps) {
      const d = s[1] + s[2] * k;
      if (t < d) return s[0];
      t -= d;
    }
    return steps[0][0];
  }

  clock() {
    const slow = !!this.props.slow;
    if (slow !== this.slowSeen) {
      this.slowSeen = slow;
      this.start = Date.now();
    }
    if (this.timer || !this.active()) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (!this.active()) return;
      const phase = this.phaseAt(Date.now() - this.start);
      if (phase !== this.state.phase) this.setState({ phase });
      this.clock();
    }, 40);
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  renderVals() {
    this.clock();
    const k = this.props.slow ? 3 : 1;
    const reduced = this.props.reducedMotion ?? this.prefersReduced();
    const phase = this.state.phase;
    const novOn = phase === 'nov' || phase === 'grabPrev' || phase === 'swipePrev';
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const drag = 'cubic-bezier(0.45, 0, 0.55, 1)';
    const ms = (x) => Math.round(x * k) + 'ms';
    const C = 490.09;
    const layer = (on, side, dragging, shift) => {
      if (reduced) return { o: on ? 1 : 0, t: 'translateX(0px)', tr: 'opacity ' + ms(240) + ' ease' };
      if (dragging) return { o: 1, t: 'translateX(' + (shift / 2) * side + 'px)', tr: 'transform ' + ms(360) + ' ' + drag };
      if (on) return { o: 1, t: 'translateX(0px)', tr: 'opacity ' + ms(240) + ' ' + ease + ' ' + ms(100) + ', transform ' + ms(320) + ' ' + ease + ' ' + ms(60) };
      return { o: 0, t: 'translateX(' + shift * side + 'px)', tr: 'opacity ' + ms(180) + ' ease, transform ' + ms(220) + ' ' + ease };
    };
    const arcs = (on, lens) => {
      const out = {};
      lens.forEach((l, i) => {
        out['a' + (i + 1)] = (on || reduced ? l : 0) + ' ' + C;
      });
      out.atr = reduced ? 'none' : on ? 'stroke-dasharray ' + ms(600) + ' ' + ease + ' ' + ms(220) : 'stroke-dasharray 0ms linear ' + ms(260);
      return out;
    };
    const nov = Object.assign(layer(novOn, 1, phase === 'swipePrev', 48), arcs(novOn, [334.6, 92.3, 54.2]));
    const oct = Object.assign(layer(!novOn, -1, phase === 'swipeNext', 48), arcs(!novOn, [231.2, 109.8, 83.7, 53.4]));
    let fingerX = 100;
    if (phase === 'swipePrev' || phase === 'oct' || phase === 'grabNext') fingerX = 280;
    const fingerOn = phase === 'grabPrev' || phase === 'swipePrev' || phase === 'grabNext' || phase === 'swipeNext';
    const moving = phase === 'swipePrev' || phase === 'swipeNext';
    return {
      nov,
      oct,
      novLabel: layer(novOn, 1, false, 16),
      octLabel: layer(!novOn, -1, false, 16),
      finger: { x: fingerX, o: fingerOn ? 1 : 0, tr: 'left ' + (moving ? ms(360) : '0ms') + ' ' + drag + ', opacity ' + ms(140) + ' ease-out' }
    };
  }
}
</script>
