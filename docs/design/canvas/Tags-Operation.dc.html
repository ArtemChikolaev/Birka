<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Операция · метка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px">
  <div style="position: absolute; inset: 0; background: radial-gradient(70% 30% at 50% 14%, {{op.glow}} 0%, transparent 72%), radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.26) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), #000000">
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 20px">
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; align-items: center; height: 44px"><a href="Tags-Trip.dc.html" aria-label="Назад" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F4F4F2; text-decoration: none; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><h1 style="margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Операция</h1><span style="justify-self: end; display: flex"><a href="Tags-QuickAdd.dc.html" style="height: 44px; padding: 0 16px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; background: rgba(255,255,255,0.08); color: #F4F4F2; text-decoration: none; font-size: 15px; font-weight: 600">Изменить</a></span></div>

      <section aria-label="Сумма" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 2px">
        <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 18px; background: {{op.tile}}; color: {{op.ink}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{op.is_cafe}}" hint-placeholder-val="{{ true }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h12v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"></path><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M9 3v2.5M13 3v2.5"></path></svg></sc-if><sc-if value="{{op.is_travel}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7 3 3 7z"></path><path d="M10 13.5 21 3"></path></svg></sc-if></span>
        <span style="font-family: Manrope, Inter, sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{op.amount}}</span>
        <span style="font-size: 20px; font-weight: 700">{{op.name}}</span>
        <span style="font-size: 15px; color: #A3A3A3">{{op.line}}</span>
      </section>

      <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
        <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: {{f.divider}}">
            <span style="color: #A3A3A3">{{f.label}}</span>
            <span style="font-weight: 600; text-align: right">{{f.value}}</span>
          </div>
        </sc-for>
      </div>

      <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
        <a href="{{tagRow.href}}" aria-label="{{tagRow.aria}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; box-sizing: border-box; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); color: #F4F4F2; text-decoration: none">
          <span aria-hidden="true" style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; display: grid; background: {{tagRow.tile}}; color: {{tagRow.ink}}; transition: background-color 220ms cubic-bezier(0.2, 0, 0, 1), color 220ms cubic-bezier(0.2, 0, 0, 1)"><span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{tagRow.planeO}}; transition: opacity 220ms cubic-bezier(0.2, 0, 0, 1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7 3 3 7z"></path><path d="M10 13.5 21 3"></path></svg></span><span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{tagRow.tagO}}; transition: opacity 220ms cubic-bezier(0.2, 0, 0, 1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5v6.1a1.6 1.6 0 0 0 .47 1.13l8.3 8.3a1.6 1.6 0 0 0 2.26 0l6-6a1.6 1.6 0 0 0 0-2.26l-8.3-8.3A1.6 1.6 0 0 0 11.1 3.5H5A1.5 1.5 0 0 0 3.5 5z"></path><circle cx="8" cy="8" r="1.4"></circle></svg></span></span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="display: grid; font-weight: 600"><span style="grid-area: 1 / 1; opacity: {{tagTitle.oa}}; transition: {{tagTitle.tr}}">{{tagTitle.a}}</span><span style="grid-area: 1 / 1; opacity: {{tagTitle.ob}}; transition: {{tagTitle.tr}}">{{tagTitle.b}}</span></span>
            <span style="display: grid; font-size: 13px; color: #A3A3A3; white-space: nowrap"><span style="grid-area: 1 / 1; opacity: {{tagLine.oa}}; transition: {{tagLine.tr}}">{{tagLine.a}}</span><span style="grid-area: 1 / 1; opacity: {{tagLine.ob}}; transition: {{tagLine.tr}}">{{tagLine.b}}</span></span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; box-sizing: border-box; padding: 12px 0">
          <span aria-hidden="true" style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; background: rgba(61,220,151,0.14); color: #3DDC97; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11V9.5A2.5 2.5 0 0 1 7.5 7H19l-3-3"></path><path d="M19 13v1.5a2.5 2.5 0 0 1-2.5 2.5H5l3 3"></path></svg></span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600">Сделать регулярным</span>
            <span style="font-size: 13px; color: #A3A3A3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{op.repeat}}</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <span style="height: 86px; box-sizing: border-box; border-radius: 22px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Повторить</span>
        <span style="height: 86px; box-sizing: border-box; border-radius: 22px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: #FF8E7F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Удалить</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["По датам поездки", "Без метки", "Добавлена вручную"], "default": "По датам поездки"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {};
    this.lines = {};
    this.timers = [];
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  renderVals() {
    const mode = this.props.state ?? 'По датам поездки';
    const reduced = this.prefersReduced();
    // A lunch on the spot got the метка by the dates of the trip; the
    // tickets, bought on 14 October, got it by hand. Without a метка the row
    // offers to add one. The row leads to the report of the метка.
    const cafe = mode === 'По датам поездки';
    const tagged = mode !== 'Без метки';
    const op = cafe
      ? { amount: '−38 ₾', name: 'Хинкальная', line: 'Сегодня, 13:20 · Вручную', tile: 'rgba(251,191,36,0.16)', ink: '#FBBF24', glow: 'rgba(251,191,36,0.10)', is_cafe: true, is_travel: false, repeat: 'Повторять каждый месяц, 12-го' }
      : { amount: '−23 800 ₽', name: 'Билеты Москва — Тбилиси', line: '14 октября, 11:05 · Вручную', tile: 'rgba(96,165,250,0.16)', ink: '#60A5FA', glow: 'rgba(96,165,250,0.10)', is_cafe: false, is_travel: true, repeat: 'Повторять каждый месяц, 14-го' };
    const facts = [
      ['Счёт', cafe ? 'Карта в лари · •• 0915' : 'Зарплатная карта · •• 4821'],
      ['Категория', cafe ? 'Кафе' : 'Поездки'],
      ['Дата', cafe ? '12 ноября' : '14 октября']
    ].map(([label, value], i, list) => ({ label, value, divider: i < list.length - 1 ? '1px solid rgba(255,255,255,0.08)' : '0' }));
    return {
      op,
      facts,
      tagTitle: this.fading('tagTitle', tagged ? 'Тбилиси' : 'Добавить метку', reduced),
      tagLine: this.fading('tagLine', cafe ? 'Поездка · 3–12 ноября · по датам' : tagged ? 'Поездка · 3–12 ноября' : 'Поездка, ремонт или праздник', reduced),
      tagRow: {
        href: tagged ? 'Tags-Trip.dc.html' : 'Tags-Picker.dc.html',
        aria: tagged ? 'Метка «Тбилиси»: отчёт' : 'Добавить метку',
        tile: tagged ? 'rgba(61,220,151,0.14)' : 'rgba(255,255,255,0.08)',
        ink: tagged ? '#3DDC97' : '#A3A3A3',
        planeO: tagged ? '1' : '0',
        tagO: tagged ? '0' : '1'
      }
    };
  }
}
</script>
</body>
</html>
