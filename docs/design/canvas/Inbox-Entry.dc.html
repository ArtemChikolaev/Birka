<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход во «Входящие»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(60% 20% at 100% 40%, rgba(36,138,86,0.20) 0%, transparent 72%), #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px">

  <sc-if value="{{overview}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 24px; padding: 20px 20px 130px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
        <span style="font-family: Manrope, Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Ноябрь</span>
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08)"></span>
      </div>
      <section aria-label="Капитал" style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Капитал · 3 валюты</span>
        <span style="font-family: Manrope, Inter, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">457 228 ₽</span>
        <span style="font-size: 13px; color: #A3A3A3">−12 340 ₽ за ноябрь</span>
      </section>

      <div style="max-height: {{card.height}}; opacity: {{card.fade}}; transform: translateY({{card.shift}}); overflow: hidden; margin-bottom: {{card.gap}}; transition: max-height 320ms ease, opacity 220ms ease, transform 320ms ease, margin-bottom 320ms ease">
        <a href="Inbox-Phone.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; text-decoration: none; color: #F4F4F2; background: linear-gradient(90deg, rgba(251,191,36,0.14), rgba(251,191,36,0.03)); border: 1px solid rgba(251,191,36,0.26)">
          <span aria-hidden="true" style="flex: 0 0 40px; height: 40px; border-radius: 14px; background: rgba(251,191,36,0.16); color: #FBBF24; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8"></path><path d="M3 13v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6h-5l-2 3h-4l-2-3z"></path></svg></span>
          <span style="flex: 1 1 auto; min-width: 0">
            <span style="display: block; font-weight: 700">15 ждут решения во «Входящих»</span>
            <span style="display: block; margin-top: 2px; font-size: 13px; color: #C9C9C7">14 без категории и перевод с Wise · после импорта Альфа-Банка</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </div>

      <section aria-label="Счета" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F4F4F2">Счета</h2>
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Все 4</span>
        </div>
        <div style="display: flex; gap: 12px; margin-right: -20px; overflow: hidden">
          <div style="flex: 0 0 236px; height: 146px; box-sizing: border-box; padding: 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(135deg, #248A56 0%, #0F3D27 100%); display: flex; flex-direction: column; justify-content: space-between">
            <span><span style="display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Зарплатная карта</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #D6D6D4">Рубли · ••4821</span></span>
            <span style="font-family: Manrope, Inter, sans-serif; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">188 913 ₽</span>
          </div>
          <div style="flex: 0 0 236px; height: 146px; box-sizing: border-box; padding: 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(135deg, #6E6E73 0%, #2A2A2C 100%)"></div>
        </div>
      </section>
      <section aria-label="Траты в ноябре" style="height: 150px; border-radius: 24px; background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,255,255,0.10)"></section>
    </div>
  </sc-if>

  <sc-if value="{{more}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 130px">
      <h1 style="margin: 0; height: 44px; display: flex; align-items: center; font-family: Manrope, Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Ещё</h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <a href="Inbox-Phone.dc.html" style="grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 68px; box-sizing: border-box; padding: 12px 14px; border-radius: 22px; text-decoration: none; color: #F4F4F2; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%)">
          <span aria-hidden="true" style="flex: 0 0 34px; height: 34px; border-radius: 12px; background: rgba(251,191,36,0.14); color: #FBBF24; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8"></path><path d="M3 13v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6h-5l-2 3h-4l-2-3z"></path></svg></span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">Входящие</span><span style="font-size: 13px; color: #A3A3A3">{{tile.line}}</span></span>
          <span style="min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 12px; background: {{tile.countBg}}; color: {{tile.countInk}}; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; transition: background 220ms ease, color 220ms ease">{{tile.count}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
          <span style="height: 92px; box-sizing: border-box; padding: 14px; border-radius: 22px; color: #F4F4F2; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); display: flex; flex-direction: column; justify-content: space-between">
            <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 12px; background: {{t.tint}}; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{t.ink}}; box-shadow: 0 0 12px {{t.ink}}"></span></span>
            <span style="font-weight: 700">{{t.title}}</span>
          </span>
        </sc-for>
      </div>
      <section aria-label="Основное" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Основное</h2>
        <div style="height: 104px; border-radius: 22px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14)"></div>
      </section>
    </div>
  </sc-if>

  <nav aria-label="Разделы" style="position: absolute; left: 32px; right: 32px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 5px; border-radius: 32px; background: rgba(32,32,34,0.52); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 12px 32px rgba(0,0,0,0.55); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <div aria-hidden="true" style="position: absolute; top: 5px; bottom: 5px; left: {{nav.left}}; width: 62.8px; border-radius: 26px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28); transition: left 380ms cubic-bezier(0.32, 0.72, 0, 1)"></div>
    <button type="button" onClick="{{toOverview}}" aria-current="{{nav.overview}}" style="position: relative; height: 52px; background: none; border: 0; color: {{nav.overviewInk}}; font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Обзор</button>
    <span style="position: relative; height: 52px; color: #B4B4B2; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>Операции</span>
    <span aria-hidden="true" style="justify-self: center; width: 50px; height: 50px; border-radius: 25px; background: #3DDC97; color: #02130B; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 22px rgba(36,138,86,0.55)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
    <span style="position: relative; height: 52px; color: #B4B4B2; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Отчёты</span>
    <button type="button" onClick="{{toMore}}" aria-current="{{nav.more}}" style="position: relative; height: 52px; background: none; border: 0; color: {{nav.moreInk}}; font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg>Ещё</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["Обзор","Ещё"],"default":"Обзор"},"waiting":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { screen: null };
  }

  componentDidUpdate(prev) {
    if (prev.screen !== this.props.screen && this.state.screen !== null) this.setState({ screen: null });
  }

  renderVals() {
    const screen = this.state.screen ?? (this.props.screen ?? 'Обзор');
    const waiting = this.props.waiting ?? true;
    const overview = screen === 'Обзор';
    return {
      overview,
      more: !overview,
      card: {
        height: waiting ? '120px' : '0px',
        fade: waiting ? '1' : '0',
        shift: waiting ? '0px' : '-8px',
        gap: waiting ? '0px' : '-24px'
      },
      tile: {
        line: waiting ? '15 ждут решения · после импорта Альфа-Банка' : 'Всё разобрано',
        count: waiting ? '15' : '0',
        countBg: waiting ? 'rgba(251,191,36,0.18)' : 'rgba(255,255,255,0.08)',
        countInk: waiting ? '#FBBF24' : '#A3A3A3'
      },
      tiles: [
        { title: 'Счета', tint: 'rgba(61,220,151,0.14)', ink: '#3DDC97' },
        { title: 'Категории', tint: 'rgba(251,191,36,0.14)', ink: '#FBBF24' },
        { title: 'Импорт', tint: 'rgba(96,165,250,0.14)', ink: '#60A5FA' },
        { title: 'Данные', tint: 'rgba(167,139,250,0.14)', ink: '#A78BFA' }
      ],
      nav: {
        left: overview ? '5px' : '256.2px',
        overview: overview ? 'page' : 'false',
        more: overview ? 'false' : 'page',
        overviewInk: overview ? '#3DDC97' : '#B4B4B2',
        moreInk: overview ? '#B4B4B2' : '#3DDC97'
      },
      toOverview: () => this.setState({ screen: 'Обзор' }),
      toMore: () => this.setState({ screen: 'Ещё' })
    };
  }
}
</script>
</body>
</html>
