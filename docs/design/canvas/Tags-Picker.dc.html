<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["Выбор", "Поиск", "Пусто"], "default": "Выбор"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh(props.state);
    this.lines = {};
    this.timers = [];
    this.box = null;
  }

  fresh(mode) {
    return { picked: { r0: true }, query: mode === 'Поиск' ? 'Батуми' : '', edge: 0 };
  }

  componentDidMount() {
    this.fadeEdge();
  }

  componentDidUpdate(prev) {
    if (prev.state !== this.props.state) {
      if (this.box) this.box.scrollTop = 0;
      this.setState(this.fresh(this.props.state));
    }
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  // The list goes softly under the search field, as ScrollEdgeFade does.
  fadeEdge() {
    const edge = this.box ? Math.min(1, Math.max(0, this.box.scrollTop / 48)) : 0;
    if (edge !== this.state.edge) this.setState({ edge });
  }

  renderVals() {
    const mode = this.props.state ?? 'Выбор';
    const st = this.state;
    const reduced = this.prefersReduced();
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    const sheetCurve = 'cubic-bezier(0.32, 0.72, 0, 1)';

    // A tap checks or unchecks a метка at once; the chip of the quick add
    // behind follows, and the cross closes the sheet. A check comes in with
    // a spring over duration.slow and leaves over duration.fast.
    const empty = mode === 'Пусто';
    const names = ['Тбилиси', 'Стамбул', 'Ереван', 'Ремонт кухни', 'Свадьба Кати', 'Работа'];
    const query = st.query.trim().toLowerCase();
    const rows = {};
    names.forEach((name, i) => {
      const id = 'r' + i;
      const on = Boolean(st.picked[id]);
      rows[id] = {
        display: !empty && (query === '' || name.toLowerCase().includes(query)) ? 'flex' : 'none',
        pressed: on ? 'true' : 'false',
        box: on ? '0' : '1.5px solid rgba(255,255,255,0.28)',
        fill: on ? '#3DDC97' : 'transparent',
        checkO: on ? '1' : '0',
        checkS: on || reduced ? '1' : '0.5',
        tr: on ? 'opacity 150ms ' + fade + ', transform 320ms ' + spring : 'opacity 150ms ' + fade + ', transform 150ms ' + ease,
        toggle: () => this.setState({ picked: { ...st.picked, [id]: !on } })
      };
    });
    const shown = (from, to) => !empty && names.slice(from, to).some((name) => query === '' || name.toLowerCase().includes(query));
    const exact = names.some((name) => name.toLowerCase() === query);
    return {
      rows,
      query: st.query,
      typed: (event) => this.setState({ query: event.target.value }),
      creating: query !== '' && !exact,
      showTrips: shown(0, 3),
      showTags: shown(3, 6),
      nothing: empty && query === '',
      edge: 'linear-gradient(to bottom, rgba(0,0,0,' + (1 - st.edge).toFixed(2) + ') 0px, #000000 48px)',
      scrolled: () => this.fadeEdge(),
      boxRef: (el) => { this.box = el; }
    };
  }
}
</script>
</body>
</html>
