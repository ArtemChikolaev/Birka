<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обзор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{bg}}; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px">
  <div style="display: flex; flex-direction: column; gap: 24px; padding: 20px 20px 130px">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: #F4F4F2; font-family: Manrope, Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; cursor: pointer">
        Октябрь
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="{{eyeLabel}}" onClick="{{toggle}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); color: #F4F4F2; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"></path></svg>
          </sc-if>
          <sc-if value="{{shown}}" hint-placeholder-val="{{ true }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </sc-if>
        </button>
        <button type="button" aria-label="Подсказки, 1 новая" style="position: relative; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); color: #F4F4F2; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
          <span aria-hidden="true" style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 4px; background: {{p.accent}}"></span>
        </button>
      </div>
    </div>

    <section aria-label="Капитал" style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Капитал · 3 валюты</div>
      <div style="font-family: Manrope, Inter, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; white-space: nowrap">{{net}}</div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 13px; background: {{p.soft}}; color: {{p.accent}}; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
          {{netDelta}}
        </span>
        <span style="font-size: 13px; color: #A3A3A3">{{rangeNote}}</span>
      </div>
      <svg width="350" height="96" viewBox="0 0 350 96" role="img" aria-label="График капитала, растёт" style="display: block; margin-top: 8px; overflow: visible">
        <defs>
          <linearGradient id="netFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="{{p.accent}}" stop-opacity="0.30"></stop>
            <stop offset="0.6" stop-color="{{p.accent}}" stop-opacity="0.08"></stop>
            <stop offset="1" stop-color="{{p.accent}}" stop-opacity="0"></stop>
          </linearGradient>
          <linearGradient id="netFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
            <stop offset="0.12" stop-color="#ffffff" stop-opacity="1"></stop>
            <stop offset="0.82" stop-color="#ffffff" stop-opacity="1"></stop>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
          </linearGradient>
          <mask id="netMask" maskUnits="userSpaceOnUse" x="0" y="0" width="350" height="96">
            <rect x="0" y="0" width="350" height="96" fill="url(#netFade)"></rect>
          </mask>
        </defs>
        <path d="{{chart.area}}" fill="url(#netFill)" mask="url(#netMask)"></path>
        <path d="{{chart.line}}" fill="none" stroke="{{p.accent}}" stroke-width="2.5" stroke-linecap="round"></path>
        <circle cx="350" cy="{{chart.endY}}" r="9" fill="{{p.accent}}" fill-opacity="0.22"></circle>
        <circle cx="350" cy="{{chart.endY}}" r="4" fill="{{p.accent}}"></circle>
      </svg>
      <div role="group" aria-label="Период" style="display: flex; gap: 6px; margin-top: 4px">
        <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: {{r.bg}}; color: {{r.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{r.label}}</button>
        </sc-for>
      </div>
    </section>

    <section aria-label="Счета" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F4F4F2">Счета</h2>
        <a href="Accounts.dc.html" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3; text-decoration: none">Все 4</a>
      </div>
      <div style="display: flex; gap: 12px; margin-right: -20px; overflow: hidden">
        <sc-for list="{{accounts}}" as="a" hint-placeholder-count="2">
          <div style="position: relative; flex: 0 0 236px; height: 146px; box-sizing: border-box; padding: 16px; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); background: {{a.art}}; background-clip: padding-box; box-shadow: {{s.cardShadow}}; display: flex; flex-direction: column; justify-content: space-between">
            <div style="display: flex; justify-content: space-between; align-items: flex-start">
              <div>
                <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F4F4F2">{{a.name}}</div>
                <div style="margin-top: 2px; font-size: 12px; color: #D6D6D4">{{a.sub}}</div>
              </div>
              <div aria-hidden="true" style="width: 30px; height: 22px; border-radius: 5px; background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.18)); border: 1px solid rgba(255,255,255,0.35)"></div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end">
              <div style="font-family: Manrope, Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap">{{a.balance}}</div>
              <div aria-hidden="true" style="width: 64px; height: 16px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.32) 0 2px, transparent 2px 8px)"></div>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-label="Траты в октябре" style="display: flex; align-items: center; gap: 18px; padding: 18px; border-radius: 24px; background: {{s.card}}; border: {{s.border}}; box-shadow: {{s.shadow}}; -webkit-backdrop-filter: {{s.blur}}; backdrop-filter: {{s.blur}}">
      <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Траты по категориям: продукты 28%, дом 20%, кафе 15%, транспорт 7%, другое 30%">
        <circle cx="48" cy="48" r="38" fill="none" stroke="#161617" stroke-width="10"></circle>
        <g transform="rotate(-90 48 48)" fill="none" stroke-width="10">
          <circle cx="48" cy="48" r="38" stroke="#4ADE80" stroke-dasharray="63.85 238.76" stroke-dashoffset="0"></circle>
          <circle cx="48" cy="48" r="38" stroke="#FBBF24" stroke-dasharray="32.81 238.76" stroke-dashoffset="-66.85"></circle>
          <circle cx="48" cy="48" r="38" stroke="#A78BFA" stroke-dasharray="44.75 238.76" stroke-dashoffset="-102.66"></circle>
          <circle cx="48" cy="48" r="38" stroke="#60A5FA" stroke-dasharray="13.71 238.76" stroke-dashoffset="-150.41"></circle>
          <circle cx="48" cy="48" r="38" stroke="#3A3A3C" stroke-dasharray="68.63 238.76" stroke-dashoffset="-167.12"></circle>
        </g>
      </svg>
      <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Траты в октябре</div>
        <div style="font-family: Manrope, Inter, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap">−{{spent}}</div>
        <sc-for list="{{legend}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px">
            <span aria-hidden="true" style="flex: 0 0 8px; height: 8px; border-radius: 4px; background: {{l.color}}"></span>
            <span style="flex: 1 1 auto; color: #D6D6D4">{{l.name}}</span>
            <span style="font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{l.amount}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <a href="Reports.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; text-decoration: none; color: #F4F4F2; background: linear-gradient(90deg, rgba(255,142,127,0.13), rgba(255,142,127,0.03)); border: 1px solid rgba(255,142,127,0.24)">
      <span aria-hidden="true" style="flex: 0 0 40px; height: 40px; border-radius: 14px; background: rgba(255,142,127,0.16); color: #FF8E7F; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 4.9L19 10l-5.1 2.1L12 17l-1.9-4.9L5 10l5.1-2.1z"></path><path d="M19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
      </span>
      <span style="flex: 1 1 auto; min-width: 0">
        <span style="display: block; font-weight: 700">Кафе: +35% к сентябрю</span>
        <span style="display: block; margin-top: 2px; font-size: 13px; color: #C9C9C7">{{insight}}</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <section aria-label="Последние операции" style="display: flex; flex-direction: column; padding: {{s.listPad}}; border-radius: 24px; background: {{s.listBg}}; border: {{s.listBorder}}; box-shadow: {{s.listShadow}}; -webkit-backdrop-filter: {{s.blur}}; backdrop-filter: {{s.blur}}">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 6px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F4F4F2">Последние операции</h2>
        <a href="Operations.dc.html" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3; text-decoration: none">Все</a>
      </div>
      <sc-for list="{{recent}}" as="t" hint-placeholder-count="4">
        <a href="Transaction.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; color: inherit; text-decoration: none">
          <span aria-hidden="true" style="flex: 0 0 42px; height: 42px; border-radius: 14px; background: {{t.tint}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{t.isCafe}}" hint-placeholder-val="{{ true }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M8 3v2M12 3v2"></path></svg>
            </sc-if>
            <sc-if value="{{t.isFood}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2"></path><circle cx="9" cy="19" r="1.5"></circle><circle cx="17" cy="19" r="1.5"></circle></svg>
            </sc-if>
            <sc-if value="{{t.isTransfer}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"></path></svg>
            </sc-if>
            <sc-if value="{{t.isIncome}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M8 10l4 4 4-4"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
            </sc-if>
          </span>
          <div style="flex: 1 1 auto; min-width: 0">
            <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</div>
            <div style="font-size: 13px; color: #A3A3A3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.meta}}</div>
          </div>
          <div style="font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: {{t.color}}">{{t.amount}}</div>
        </a>
      </sc-for>
    </section>
  </div>

  <div>
    <nav aria-label="Разделы" style="position: absolute; left: 32px; right: 32px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 5px; border-radius: 32px; background: {{nav.bg}}; -webkit-backdrop-filter: {{nav.blur}}; backdrop-filter: {{nav.blur}}; border: {{nav.border}}; box-shadow: {{nav.shadow}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
      <div aria-hidden="true" style="position: absolute; top: 5px; bottom: 5px; left: {{bubble.left}}; width: {{bubble.width}}; border-radius: 26px; background: {{nav.bubble}}; box-shadow: {{nav.bubbleShadow}}; transition: left 560ms cubic-bezier(0.34, 1.56, 0.64, 1)"></div>
      <button type="button" onClick="{{go.overview}}" aria-pressed="{{on.overview}}" style="position: relative; background: none; border: 0; padding: 0; color: {{tc.overview}}; font: inherit; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
        Обзор
      </button>
      <button type="button" onClick="{{go.operations}}" aria-pressed="{{on.operations}}" style="position: relative; background: none; border: 0; padding: 0; color: {{tc.operations}}; font: inherit; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>
        Операции
      </button>
      <a href="QuickAdd.dc.html" aria-label="Новая операция" style="justify-self: center; position: relative; width: 50px; height: 50px; border-radius: 25px; background: {{p.accent}}; color: #02130B; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 22px {{p.glow}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
      <button type="button" onClick="{{go.budget}}" aria-pressed="{{on.budget}}" style="position: relative; background: none; border: 0; padding: 0; color: {{tc.budget}}; font: inherit; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>
        Отчёты
      </button>
      <button type="button" onClick="{{go.more}}" aria-pressed="{{on.more}}" style="position: relative; background: none; border: 0; padding: 0; color: {{tc.more}}; font: inherit; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg>
        Ещё
      </button>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["emerald","teal","violet"],"default":"emerald"},"nav":{"editor":"enum","options":["liquid","solid"],"default":"liquid"},"surface":{"editor":"enum","options":["solid","glass"],"default":"solid"},"hideAmounts":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hidden: null, range: 'month', tab: 'overview' };
  }

  renderVals() {
    const accents = {
      emerald: { accent: '#3DDC97', edge: 'rgba(36,138,86,0.30)', soft: 'rgba(61,220,151,0.14)', glow: 'rgba(36,138,86,0.55)' },
      teal: { accent: '#3CD5C8', edge: 'rgba(30,128,132,0.30)', soft: 'rgba(60,213,200,0.14)', glow: 'rgba(30,128,132,0.55)' },
      violet: { accent: '#B79CFF', edge: 'rgba(104,68,214,0.30)', soft: 'rgba(183,156,255,0.16)', glow: 'rgba(104,68,214,0.55)' }
    };
    const p = accents[this.props.accent] ?? accents.emerald;
    const liquid = (this.props.nav ?? 'liquid') !== 'solid';
    const nav = liquid
      ? {
          bg: 'rgba(32,32,34,0.52)',
          blur: 'blur(22px) saturate(170%)',
          border: '1px solid rgba(255,255,255,0.14)',
          shadow: 'inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.05), 0 12px 32px rgba(0,0,0,0.55)',
          bubble: 'rgba(255,255,255,0.13)',
          bubbleShadow: 'inset 0 1px 0 rgba(255,255,255,0.28), 0 4px 14px rgba(0,0,0,0.35)'
        }
      : {
          bg: '#121213',
          blur: 'none',
          border: '1px solid rgba(255,255,255,0.08)',
          shadow: '0 12px 32px rgba(0,0,0,0.55)',
          bubble: p.soft,
          bubbleShadow: 'none'
        };
    const hidden = this.state.hidden ?? (this.props.hideAmounts ?? false);
    const m = (s) => (hidden ? s.replace(/\d[\d ,]*\d|\d/g, '••••') : s);

    const glass = (this.props.surface ?? 'solid') === 'glass';
    const s = glass
      ? {
          card: 'linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%)',
          border: '1px solid rgba(255,255,255,0.14)',
          shadow: 'inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)',
          blur: 'blur(18px) saturate(160%)',
          cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.22)',
          listPad: '14px 14px 4px',
          listBg: 'linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%)',
          listBorder: '1px solid rgba(255,255,255,0.14)',
          listShadow: 'inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)'
        }
      : {
          card: '#0E0E0F',
          border: '1px solid rgba(255,255,255,0.09)',
          shadow: 'none',
          blur: 'none',
          cardShadow: 'none',
          listPad: '0',
          listBg: 'transparent',
          listBorder: '0',
          listShadow: 'none'
        };
    const corners = 'radial-gradient(62% 34% at 0% 0%, ' + p.edge + ' 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, ' + p.edge + ' 0%, transparent 74%)';
    const bg = glass
      ? corners + ', radial-gradient(64% 20% at 0% 72%, ' + p.edge + ' 0%, transparent 72%), #000000'
      : corners + ', #000000';

    const slots = { overview: 0, operations: 1, budget: 3, more: 4 };
    const tab = this.state.tab;
    const index = slots[tab] ?? 0;
    const slot = 314 / 5;
    const go = {};
    const on = {};
    const tc = {};
    for (const id of Object.keys(slots)) {
      go[id] = () => this.setState({ tab: id });
      on[id] = tab === id ? 'true' : 'false';
      tc[id] = tab === id ? p.accent : '#B4B4B2';
    }

    const charts = {
      week: { line: 'M0 52 C40 50 60 60 90 56 S140 40 175 44 S230 50 260 38 S310 26 350 22', endY: 22, delta: '+6 800 ₽', note: 'за неделю' },
      month: { line: 'M0 70 C30 68 48 56 72 58 S112 66 138 52 S180 36 206 42 S252 28 278 24 S324 18 350 10', endY: 10, delta: '+42 300 ₽', note: 'за октябрь' },
      year: { line: 'M0 84 C40 80 70 76 100 70 S160 62 190 52 S240 44 270 34 S320 20 350 12', endY: 12, delta: '+318 000 ₽', note: 'за год' }
    };
    const range = this.state.range;
    const chart = charts[range] ?? charts.month;
    const ranges = [['week', 'Неделя'], ['month', 'Месяц'], ['year', 'Год']].map(([id, label]) => ({
      label,
      pick: () => this.setState({ range: id }),
      pressed: range === id ? 'true' : 'false',
      bg: range === id ? '#F4F4F2' : 'rgba(255,255,255,0.06)',
      fg: range === id ? '#000000' : '#C9C9C7'
    }));

    return {
      p,
      s,
      bg,
      nav,
      bubble: { left: (5 + index * slot).toFixed(1) + 'px', width: slot.toFixed(1) + 'px' },
      go,
      on,
      tc,
      hidden,
      shown: !hidden,
      eyeLabel: hidden ? 'Показать суммы' : 'Скрыть суммы',
      toggle: () => this.setState({ hidden: !hidden }),
      net: m('1 284 560 ₽'),
      netDelta: m(chart.delta),
      rangeNote: chart.note,
      chart: { line: chart.line, area: chart.line + ' L350 96 L0 96 Z', endY: chart.endY },
      ranges,
      spent: m('86 420 ₽'),
      insight: m('12 850 ₽ — на 3 300 ₽ больше обычного'),
      accounts: [
        { name: 'Зарплатная', sub: 'Рубли · •• 4568', balance: m('412 300 ₽'), art: 'radial-gradient(120% 130% at 100% 100%, rgba(30,150,92,0.85) 0%, rgba(14,70,44,0.55) 38%, transparent 66%), radial-gradient(70% 80% at 0% 0%, rgba(120,214,166,0.20) 0%, transparent 60%), linear-gradient(135deg, #0A1A12 0%, #030504 100%)' },
        { name: 'Накопления', sub: 'Цель · 1 000 000 ₽', balance: m('640 000 ₽'), art: 'linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.10) 50%, transparent 62%), linear-gradient(150deg, #38383B 0%, #19191B 40%, #0A0A0B 100%)' },
        { name: 'Евро-счёт', sub: 'Евро · •• 1207', balance: m('2 140 €'), art: 'radial-gradient(120% 130% at 100% 100%, rgba(40,118,150,0.80) 0%, rgba(16,56,74,0.5) 40%, transparent 68%), linear-gradient(135deg, #07141A 0%, #030607 100%)' },
        { name: 'Наличные', sub: 'Рубли', balance: m('18 500 ₽'), art: 'radial-gradient(120% 130% at 0% 0%, rgba(178,122,40,0.55) 0%, transparent 62%), linear-gradient(135deg, #18110A 0%, #050403 100%)' }
      ],
      legend: [
        { name: 'Продукты', amount: m('24 300 ₽'), color: '#4ADE80' },
        { name: 'Дом', amount: m('17 280 ₽'), color: '#A78BFA' },
        { name: 'Кафе', amount: m('12 850 ₽'), color: '#FBBF24' }
      ],
      recent: [
        { title: 'Кофейня у дома', meta: 'Кафе · Зарплатная · сегодня', amount: m('−250 ₽'), color: '#F4F4F2', tint: 'rgba(251,191,36,0.14)', ink: '#FBBF24', isCafe: true, isFood: false, isTransfer: false, isIncome: false },
        { title: 'Супермаркет', meta: 'Продукты · Зарплатная · вчера', amount: m('−2 430 ₽'), color: '#F4F4F2', tint: 'rgba(74,222,128,0.14)', ink: '#4ADE80', isCafe: false, isFood: true, isTransfer: false, isIncome: false },
        { title: 'На накопления', meta: 'Перевод · 28 октября', amount: m('20 000 ₽'), color: '#A3A3A3', tint: 'rgba(255,255,255,0.08)', ink: '#D6D6D4', isCafe: false, isFood: false, isTransfer: true, isIncome: false },
        { title: 'Зарплата', meta: 'Доход · 25 октября', amount: m('+210 000 ₽'), color: p.accent, tint: p.soft, ink: p.accent, isCafe: false, isFood: false, isTransfer: false, isIncome: true }
      ]
    };
  }
}
