<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["Пусто", "Из контактов", "Номер"], "default": "Из контактов"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh(props.state);
    this.lines = {};
    this.timers = [];
    this.box = null;
  }
  fresh(mode) {
    const picked = mode !== 'Пусто';
    return {
      picked,
      name: picked ? 'Иван' : '',
      about: picked ? 'коллега из бухгалтерии' : '',
      numbers: mode === 'Номер',
      number: 'mobile',
      phase: 'person',
      flash: false
    };
  }

  componentDidUpdate(prev) {
    if (prev.state !== this.props.state) {
      this.stop();
      this.lines = {};
      this.setState(this.fresh(this.props.state));
    }
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  renderVals() {
    const st = this.state;
    const reduced = this.prefersReduced();
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    const sheetCurve = 'cubic-bezier(0.32, 0.72, 0, 1)';

    // The system window of the contacts gives Birka only the contact that
    // was picked: «Иванов Иван Петрович» with two numbers. Its first name
    // goes into «Имя», which the person may shorten or change; «кто это»
    // stays theirs to write. The fields light up for a moment as they fill.
    const picked = st.picked;
    const open = st.phase === 'person';
    const numbers = { mobile: ['Мобильный', '+7 999 123-45-67'], work: ['Рабочий', '+7 495 765-43-21'], none: ['Без номера', ''] };
    const lit = st.flash && !reduced;
    const fieldOf = (value, key) => ({
      value,
      edge: lit && value && key !== 'about' ? 'rgba(61,220,151,0.55)' : 'rgba(255,255,255,0.12)',
      fill: lit && value && key !== 'about' ? 'rgba(61,220,151,0.08)' : '#0E0E0F',
      typed: (event) => this.setState({ [key]: event.target.value })
    });
    const number = numbers[st.number];
    const added = st.phase === 'form';
    const name = st.name.trim();
    const about = st.about.trim();
    // A name that another person has already asks «кто это», so that the
    // two can be told apart in the chips.
    const twin = name.toLowerCase() === 'иван' && !about;
    const chip = (name, about, on, shown) => ({
      name,
      about: about ? ' · ' + about : '',
      pressed: on ? 'true' : 'false',
      bg: on ? '#F4F4F2' : 'rgba(255,255,255,0.08)',
      fg: on ? '#0A0A0A' : '#D6D6D4',
      aboutInk: on ? '#4A4A4A' : '#8A8A8A',
      max: shown ? '260px' : '0px',
      o: shown ? '1' : '0',
      tr: reduced ? 'opacity 220ms ' + fade : 'max-width 320ms ' + ease + ', opacity 220ms ' + fade + ' 100ms'
    });
    return {
      chips: [
        chip('Маша', '', false, true),
        chip('Иван', 'сосед', false, true),
        chip('Саша', '', false, true),
        chip(name || 'Иван', about, added, added)
      ],
      f: {
        amount: '2 000 ₽', account: 'Зарплатная карта', when: 'Сегодня', due: '20 ноября', note: 'на подарок',
        amountInk: '#F4F4F2', accountInk: '#F4F4F2', whenInk: '#F4F4F2', dueInk: '#F4F4F2', noteInk: '#F4F4F2'
      },
      name: fieldOf(st.name, 'name'),
      about: fieldOf(st.about, 'about'),
      phone: fieldOf(picked ? number[1] : '', 'phone'),
      twin: {
        rows: twin ? '1fr' : '0fr',
        o: twin ? '1' : '0',
        tr: reduced ? 'opacity 220ms ' + fade : 'grid-template-rows 220ms ' + ease + ', opacity 220ms ' + fade
      },
      kind: { shown: picked && st.number !== 'none', label: number[0].toLowerCase() },
      caption: this.fading('caption', picked
        ? 'Из контактов: Иванов Иван Петрович. Birka взяла только этот контакт, а номер хранит на этом телефоне.'
        : 'Имя видно в списке и в напоминаниях. «Кто это» поможет различить тёзок.', reduced),
      doneO: name ? '1' : '0.4',
      numbers: Object.entries(numbers).map(([id, [title, line]], i, all) => ({
        title,
        line: line || 'Напомнить можно будет через другое приложение',
        check: st.number === id ? '1' : '0',
        divider: i < all.length - 1 ? '1px solid rgba(255,255,255,0.06)' : '0',
        pick: () => {
          this.setState({ number: id, numbers: false });
        }
      })),
      person: { t: open ? 'translateY(0px)' : 'translateY(105%)', tr: 'transform ' + (open ? 460 : 300) + 'ms ' + sheetCurve },
      shade: { o: open ? '0.45' : '0', events: open ? 'auto' : 'none', tr: 'opacity ' + (open ? 460 : 300) + 'ms ' + sheetCurve },
      numbersSheet: { t: st.numbers ? 'translateY(0px)' : 'translateY(105%)', tr: 'transform ' + (st.numbers ? 460 : 300) + 'ms ' + sheetCurve },
      numbersShade: { o: st.numbers ? '0.45' : '0', events: st.numbers ? 'auto' : 'none', tr: 'opacity ' + (st.numbers ? 460 : 300) + 'ms ' + sheetCurve },
      pick: () => {
        this.stop();
        this.setState({ picked: true, name: 'Иван', number: 'mobile', flash: true });
        this.later(700, { flash: false });
      },
      openNumbers: () => this.setState({ numbers: true }),
      closeNumbers: () => this.setState({ numbers: false }),
      openPerson: () => this.setState({ phase: 'person' }),
      closePerson: () => this.setState({ phase: 'closed' }),
      done: () => {
        if (!name || st.phase !== 'person') return;
        this.setState({ phase: 'form' });
      }
    };
  }
}
</script>
</body>
</html>
