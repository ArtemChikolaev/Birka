<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ещё и настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(60% 20% at 100% 40%, rgba(36,138,86,0.20) 0%, transparent 72%), #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px">
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 130px">

    <h1 style="margin: 0; height: 44px; display: flex; align-items: center; font-family: Manrope, Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Ещё</h1>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="4">
        <a href="{{tile.href}}" style="position: relative; height: 92px; box-sizing: border-box; padding: 14px; border-radius: 22px; text-decoration: none; color: #F4F4F2; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); display: flex; flex-direction: column; justify-content: space-between">
          <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 12px; background: {{tile.tint}}; display: flex; align-items: center; justify-content: center">
            <span style="width: 12px; height: 12px; border-radius: 6px; background: {{tile.ink}}; box-shadow: 0 0 12px {{tile.ink}}"></span>
          </span>
          <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 6px">
            <span style="font-weight: 700">{{tile.title}}</span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #A3A3A3">{{tile.badge}}</span>
          </span>
        </a>
      </sc-for>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">{{g.title}}</h2>
        <div style="border-radius: 22px; padding: 2px 16px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%)">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <sc-if value="{{r.isLink}}" hint-placeholder-val="{{ false }}">
              <a href="{{r.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: {{r.divider}}; color: #F4F4F2; text-decoration: none">
                <span style="font-weight: 500">{{r.label}}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </a>
            </sc-if>
            <sc-if value="{{r.isRow}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: {{r.divider}}">
              <span style="font-weight: 500; color: {{r.color}}">{{r.label}}</span>
              <sc-if value="{{r.isValue}}" hint-placeholder-val="{{ true }}">
                <span style="display: flex; align-items: center; gap: 6px; color: #A3A3A3">
                  {{r.value}}
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
                </span>
              </sc-if>
              <sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{ false }}">
                <button type="button" role="switch" aria-checked="{{r.checked}}" aria-label="{{r.label}}" onClick="{{r.flip}}" style="position: relative; flex: 0 0 52px; height: 32px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.16); background: {{r.track}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); cursor: pointer; transition: background 220ms ease">
                  <span aria-hidden="true" style="position: absolute; top: 2px; left: {{r.knob}}; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.4); transition: left 380ms cubic-bezier(0.34, 1.56, 0.64, 1)"></span>
                </button>
              </sc-if>
            </div>
            </sc-if>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div style="text-align: center; font-size: 12px; color: #8A8A8A; line-height: 1.6">Birka 0.1.0 · данные хранятся на этом устройстве<br><a href="#" style="color: #A3A3A3">Исходный код на GitHub</a></div>
  </div>

  <nav aria-label="Разделы" style="position: absolute; left: 32px; right: 32px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 5px; border-radius: 32px; background: rgba(32,32,34,0.52); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 12px 32px rgba(0,0,0,0.55); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <div aria-hidden="true" style="position: absolute; top: 5px; bottom: 5px; left: 256.2px; width: 62.8px; border-radius: 26px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28)"></div>
    <a href="Main.dc.html" style="position: relative; height: 52px; color: #B4B4B2; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Обзор</a>
    <a href="Operations.dc.html" style="position: relative; height: 52px; color: #B4B4B2; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>Операции</a>
    <a href="QuickAdd.dc.html" aria-label="Новая операция" style="justify-self: center; position: relative; width: 50px; height: 50px; border-radius: 25px; background: #3DDC97; color: #02130B; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 22px rgba(36,138,86,0.55)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Reports.dc.html" style="position: relative; height: 52px; color: #B4B4B2; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Отчёты</a>
    <a href="More.dc.html" aria-current="page" style="position: relative; height: 52px; color: #3DDC97; text-decoration: none; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg>Ещё</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lock: true, hide: false, demo: false };
  }

  renderVals() {
    const st = this.state;
    const toggle = (key, label) => ({
      label,
      isRow: true,
      isLink: false,
      isValue: false,
      isSwitch: true,
      checked: st[key] ? 'true' : 'false',
      track: st[key] ? '#3DDC97' : 'rgba(255,255,255,0.14)',
      knob: st[key] ? '22px' : '2px',
      flip: () => this.setState({ [key]: !st[key] }),
      color: '#F4F4F2'
    });
    const value = (label, val, color) => ({ label, value: val, isRow: true, isLink: false, isValue: true, isSwitch: false, color: color ?? '#F4F4F2' });
    const link = (label, href) => ({ label, href, isRow: false, isLink: true, isValue: false, isSwitch: false, color: '#F4F4F2' });
    const withDividers = (rows) => rows.map((r, i) => ({ ...r, divider: i < rows.length - 1 ? '1px solid rgba(255,255,255,0.06)' : '0' }));
    return {
      tiles: [
        { title: 'Счета', badge: '4', href: 'Accounts.dc.html', tint: 'rgba(61,220,151,0.14)', ink: '#3DDC97' },
        { title: 'Категории', badge: '24', href: '#', tint: 'rgba(251,191,36,0.14)', ink: '#FBBF24' },
        { title: 'Импорт', badge: 'скоро', href: '#', tint: 'rgba(96,165,250,0.14)', ink: '#60A5FA' },
        { title: 'Данные', badge: 'копия', href: 'Data.dc.html', tint: 'rgba(167,139,250,0.14)', ink: '#A78BFA' }
      ],
      groups: [
        { title: 'Основное', rows: withDividers([value('Базовая валюта', '₽ RUB'), value('Язык', 'Русский'), value('Тема', 'Тёмная'), value('Начало месяца', '25 число')]) },
        { title: 'Безопасность', rows: withDividers([toggle('lock', 'Вход по Face ID'), toggle('hide', 'Скрывать суммы при запуске')]) },
        { title: 'Поддержка', rows: withDividers([link('Помощь и отзыв', 'Help.dc.html')]) }
      ]
    };
  }
}
</script>
</body>
</html>
