<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Долг · Маша</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(60% 20% at 0% 55%, rgba(36,138,86,0.18) 0%, transparent 72%), #000000">
  <div ref="{{boxRef}}" style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none">
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 40px">
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; align-items: center; height: 44px"><a href="Debts-List.dc.html" aria-label="Назад" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F4F4F2; text-decoration: none; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><h1 style="margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Долг</h1><span style="justify-self: end; display: flex"><a href="Debt-Form.dc.html" style="height: 44px; padding: 0 16px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; background: rgba(255,255,255,0.08); color: #F4F4F2; text-decoration: none; font-size: 15px; font-weight: 600">Изменить</a></span></div>

      <section aria-label="Долг" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 2px; text-align: center">
        <span style="position: relative; display: flex">
          <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 22px; background: {{who.tint}}; color: {{who.ink}}; display: flex; align-items: center; justify-content: center; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 30px">{{who.letter}}</span>
          <span aria-hidden="true" style="position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 13px; background: #3DDC97; color: #04130B; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #000; opacity: {{closed.o}}; transform: scale({{closed.s}}); transition: {{closed.tr}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        </span>
        <span style="font-size: 20px; font-weight: 700">{{who.name}}</span>
        <span style="font-family: Manrope, Inter, sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{left}}</span>
        <span style="display: grid; font-size: 15px; color: #A3A3A3"><span style="grid-area: 1 / 1; opacity: {{line.oa}}; transition: {{line.tr}}">{{line.a}}</span><span style="grid-area: 1 / 1; opacity: {{line.ob}}; transition: {{line.tr}}">{{line.b}}</span></span>
      </section>

      <section aria-label="Сколько вернули" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 22px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <span style="font-weight: 600">{{progress.title}}</span>
          <span style="font-size: 13px; color: #A3A3A3; font-variant-numeric: tabular-nums">{{progress.share}}</span>
        </div>
        <span aria-hidden="true" style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden">
          <span style="display: block; height: 8px; width: {{progress.width}}; border-radius: 4px; background: #3DDC97; transform-origin: 0 50%; transform: scaleX({{grow}}); transition: transform 520ms cubic-bezier(0.2, 0, 0, 1), width 520ms cubic-bezier(0.2, 0, 0, 1)"></span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px; padding-top: 4px; font-size: 14px; color: {{dueInk}}; transition: color 220ms cubic-bezier(0.4, 0, 0.2, 1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15.5 6 9.5z"></path><path d="M10 20.5a2.2 2.2 0 0 0 4 0"></path></svg><span style="display: grid; "><span style="grid-area: 1 / 1; opacity: {{due.oa}}; transition: {{due.tr}}">{{due.a}}</span><span style="grid-area: 1 / 1; opacity: {{due.ob}}; transition: {{due.tr}}">{{due.b}}</span></span></span>
      </section>

      <div style="display: flex; gap: 12px">
        <a href="Debt-Return.dc.html" style="flex: 1 1 0; min-width: 0; height: 84px; box-sizing: border-box; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); color: #3DDC97"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg><span>{{actions.main}}</span></a>
        <a href="Debt-Form.dc.html" style="flex: 1 1 0; min-width: 0; height: 84px; box-sizing: border-box; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); color: #F4F4F2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>{{actions.more}}</span></a>
      </div>

      <section aria-label="История" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">История</h2>
        <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)"><sc-for list="{{history}}" as="h" hint-placeholder-count="2"><div style="display: grid; grid-template-rows: {{h.rows}}; opacity: {{h.o}}; transition: {{h.tr}}"><div style="overflow: hidden; min-height: 0"><div style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 0; border-bottom: {{h.divider}}"><span aria-hidden="true" style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; background: {{h.tint}}; color: {{h.ink}}; display: grid"><span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{h.outO}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9"></path><path d="M7 14l5-5 5 5"></path><path d="M5 4h14"></path></svg></span><span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{h.inO}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></span></span><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{h.title}}</span><span style="font-size: 13px; line-height: 1.35; color: #A3A3A3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{h.line}}</span></span><span style="flex: 0 0 auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: {{h.color}}">{{h.amount}}</span></div></div></div></sc-for></div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["Часть вернули", "Всё вернули", "Мой долг"], "default": "Часть вернули"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { grown: false };
    this.lines = {};
    this.timers = [];
    this.box = null;
  }
  // The bar grows from nothing once the card is in, over duration.roll; with
  // less motion it stands at its length.
  componentDidMount() {
    this.timers.push(setTimeout(() => this.setState({ grown: true }), 120));
  }

  componentDidUpdate(prev) {
    if (prev.state !== this.props.state) {
      this.stop();
      if (this.box) this.box.scrollTop = 0;
    }
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  renderVals() {
    const mode = this.props.state ?? 'Часть вернули';
    const reduced = this.prefersReduced();
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    const sheetCurve = 'cubic-bezier(0.32, 0.72, 0, 1)';

    // Маша took 5 000 ₽ in cash on 3 November and gave 2 000 ₽ back on
    // 10 November; once all of it is back the card says so with a check.
    // A debt of the person to Саша reads the other way round.
    const all = mode === 'Всё вернули';
    const mine = mode === 'Мой долг';
    const up = (title, line, value, color) => ({ title, line, amount: value, color, outO: '1', inO: '0', tint: 'rgba(255,255,255,0.08)', ink: '#D6D6D4' });
    const down = (title, line, value, color) => ({ title, line, amount: value, color, outO: '0', inO: '1', tint: 'rgba(61,220,151,0.14)', ink: '#3DDC97' });
    const history = mine
      ? [down('Заняли', '8 ноября · на Зарплатную карту · до зарплаты', '+4 000 ₽', '#F4F4F2')]
      : all
        ? [down('Возврат', 'Сегодня · на Зарплатную карту', '+3 000 ₽', '#3DDC97'),
           down('Возврат', '10 ноября · на Зарплатную карту', '+2 000 ₽', '#3DDC97'),
           up('В долг', '3 ноября · с Наличных · на билеты', '−5 000 ₽', '#F4F4F2')]
        : [down('Возврат', '10 ноября · на Зарплатную карту', '+2 000 ₽', '#3DDC97'),
           up('В долг', '3 ноября · с Наличных · на билеты', '−5 000 ₽', '#F4F4F2')];
    const share = mine ? 0 : all ? 100 : 40;
    const line = mine ? 'осталось отдать из 4 000 ₽' : all ? 'вернули всё · сегодня' : 'осталось вернуть вам из 5 000 ₽';
    return {
      who: mine
        ? { name: 'Саша', letter: 'С', tint: 'rgba(251,191,36,0.16)', ink: '#FBBF24' }
        : { name: 'Маша', letter: 'М', tint: 'rgba(74,222,128,0.16)', ink: '#4ADE80' },
      left: mine ? '4 000 ₽' : all ? '0 ₽' : '3 000 ₽',
      line: this.fading('line', line, reduced),
      closed: { o: all ? '1' : '0', s: all || reduced ? '1' : '0.4', tr: reduced ? 'opacity 220ms ' + fade : 'opacity 220ms ' + fade + ', transform 320ms ' + spring },
      progress: {
        title: mine ? 'Отдали 0 ₽' : all ? 'Вернули 5 000 ₽' : 'Вернули 2 000 ₽',
        share: share + '%',
        width: Math.max(share, 0) + '%'
      },
      grow: this.state.grown || reduced ? '1' : '0',
      due: this.fading('due', all
        ? 'Долг закрыт · напоминание снято'
        : mine ? 'Срок 20 ноября · через 6 дней' : 'Срок 1 декабря · напомним в этот день', reduced),
      dueInk: all ? '#A3A3A3' : '#C9C9C7',
      actions: mine ? { main: 'Отдать', more: 'Занять ещё' } : all ? { main: 'Возврат', more: 'Новый долг' } : { main: 'Возврат', more: 'Ещё в долг' },
      history: history.map((h, i) => ({ ...h, rows: '1fr', o: '1', tr: 'none', divider: i < history.length - 1 ? '1px solid rgba(255,255,255,0.06)' : '0' })),
      boxRef: (el) => { this.box = el; }
    };
  }
}
</script>
</body>
</html>
