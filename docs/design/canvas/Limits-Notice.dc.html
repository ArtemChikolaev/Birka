<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Уведомления · лимиты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(60% 20% at 100% 40%, rgba(36,138,86,0.20) 0%, transparent 72%), #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px">
  <div style="position: absolute; inset: 0; overflow-y: auto; height: 846px">
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 48px">

      <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px">
        <a href="Limits-Overview.dc.html" aria-label="Назад" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F4F4F2; text-decoration: none; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
        <h1 style="margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Уведомления</h1>
        <span aria-hidden="true"></span>
      </div>

      <sc-if value="{{hasAny}}" hint-placeholder-val="{{ true }}">
        <div role="tablist" aria-label="Чьи уведомления" style="display: flex; gap: 6px; margin-right: -20px; padding-right: 20px; overflow-x: auto; scrollbar-width: none">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <button type="button" role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="flex: 0 0 auto; height: 34px; padding: 0 10px; border-radius: 17px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; cursor: pointer; transition: background 200ms ease, color 200ms ease">{{f.label}}<span aria-hidden="true" style="display: block; overflow: hidden; max-width: {{f.countW}}; margin-left: {{f.countGap}}; opacity: {{f.countO}}; transition: {{f.countTr}}"><span style="display: block; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: {{f.countBg}}; color: {{f.countInk}}; font-size: 12px; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums">{{f.count}}</span></span></button>
          </sc-for>
        </div>

        <section aria-label="Новые" style="display: flex; flex-direction: column; gap: 8px; max-height: {{fresh.height}}; opacity: {{fresh.o}}; margin-bottom: {{fresh.pull}}; overflow: hidden; transition: {{fresh.tr}}">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px">
            <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C9C9C7">{{fresh.title}}</h2>
            <button type="button" onClick="{{readAll}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #3DDC97; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Прочитать все</button>
          </div>
          <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
            <sc-for list="{{fresh.items}}" as="n" hint-placeholder-count="2">
              <a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-bottom: {{n.divider}}; color: #F4F4F2; text-decoration: none">
                <span aria-hidden="true" style="flex: 0 0 8px; height: 8px; border-radius: 4px; background: #3DDC97; box-shadow: 0 0 8px rgba(61,220,151,0.70); opacity: {{n.dotO}}; transition: {{n.dotTr}}"></span>
                <span aria-hidden="true" style="flex: 0 0 36px; height: 36px; border-radius: 12px; overflow: hidden; background: {{n.tileBg}}; color: {{n.tileInk}}; display: flex; align-items: center; justify-content: center">
                  <sc-if value="{{n.pay}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17"></path><path d="M8 3v4M16 3v4"></path></svg></sc-if>
                  <sc-if value="{{n.limit}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path><circle cx="12" cy="17" r="1.2"></circle></svg></sc-if>
                  <sc-if value="{{n.import}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></sc-if>
                  <sc-if value="{{n.birka}}" hint-placeholder-val="{{ false }}"><img src="birka-app-icon.png" alt="" style="display: block; width: 36px; height: 36px"></sc-if>
                </span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span><span style="font-size: 13px; color: #C9C9C7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.line}}</span></span>
                <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #3DDC97; white-space: nowrap">{{n.time}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
              </a>
            </sc-for>
          </div>
        </section>

        <section aria-label="История" style="display: flex; flex-direction: column; margin-top: -18px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
            <section aria-label="{{d.day}}" style="display: flex; flex-direction: column; gap: 8px; max-height: {{d.height}}; padding-top: {{d.pad}}; opacity: {{d.o}}; overflow: hidden; transition: {{d.tr}}">
              <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C9C9C7">{{d.day}}</h2>
              <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
                <sc-for list="{{d.items}}" as="m" hint-placeholder-count="1">
                  <sc-if value="{{m.link}}" hint-placeholder-val="{{ true }}">
                    <a href="{{m.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; box-sizing: border-box; padding: 12px 0; border-bottom: {{m.divider}}; color: #F4F4F2; text-decoration: none">
                      <span aria-hidden="true" style="flex: 0 0 36px; height: 36px; border-radius: 12px; overflow: hidden; background: {{m.tileBg}}; color: {{m.tileInk}}; display: flex; align-items: center; justify-content: center">
                        <sc-if value="{{m.pay}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17"></path><path d="M8 3v4M16 3v4"></path></svg></sc-if>
                        <sc-if value="{{m.limit}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path><circle cx="12" cy="17" r="1.2"></circle></svg></sc-if>
                        <sc-if value="{{m.import}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></sc-if>
                      </span>
                      <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                        <span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.title}}</span>
                        <span style="font-size: 13px; line-height: 1.35; color: {{m.lineInk}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{m.line}}</span>
                      </span>
                      <span style="flex: 0 0 auto; font-size: 12px; font-weight: 600; color: #8A8A8A; white-space: nowrap; font-variant-numeric: tabular-nums">{{m.time}}</span>
                    </a>
                  </sc-if>
                  <sc-if value="{{m.plain}}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; box-sizing: border-box; padding: 12px 0; border-bottom: {{m.divider}}">
                      <span aria-hidden="true" style="flex: 0 0 36px; height: 36px; border-radius: 12px; overflow: hidden; background: {{m.tileBg}}; display: flex; align-items: center; justify-content: center"><img src="birka-app-icon.png" alt="" style="display: block; width: 36px; height: 36px"></span>
                      <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                        <span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.title}}</span>
                        <span style="font-size: 13px; line-height: 1.35; color: {{m.lineInk}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{m.line}}</span>
                      </span>
                      <span style="flex: 0 0 auto; font-size: 12px; font-weight: 600; color: #8A8A8A; white-space: nowrap; font-variant-numeric: tabular-nums">{{m.time}}</span>
                    </div>
                  </sc-if>
                </sc-for>
              </div>
            </section>
          </sc-for>
          <span style="align-self: center; padding-top: 18px; font-size: 12px; color: #8A8A8A">Birka хранит уведомления 90 дней</span>
        </section>
      </sc-if>

      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 150px 24px 0">
          <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 18px; background: rgba(61,220,151,0.14); color: #3DDC97; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15.5 6 9.5z"></path><path d="M10 20.5a2.2 2.2 0 0 0 4 0"></path></svg></span>
          <span style="font-family: Manrope, Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Пока тихо</span>
          <span style="max-width: 290px; font-size: 14px; line-height: 1.45; color: #C9C9C7">Здесь появятся напоминания о платежах, лимиты, итоги импорта и новости Birka.</span>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["Есть новые","Всё прочитано","Пусто"],"default":"Есть новые"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { read: false, filter: 'all' };
  }

  componentDidUpdate(prevProps) {
    // Another state from the panel starts the board afresh.
    if (prevProps.state !== this.props.state && (this.state.read || this.state.filter !== 'all')) {
      this.setState({ read: false, filter: 'all' });
    }
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  renderVals() {
    const mode = this.props.state ?? 'Есть новые';
    const empty = mode === 'Пусто';
    const read = mode === 'Всё прочитано' || this.state.read;
    const filter = this.state.filter;
    const reduced = this.prefersReduced();
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    const tiles = {
      pay: ['rgba(251,191,36,0.16)', '#FBBF24'],
      import: ['rgba(96,165,250,0.16)', '#60A5FA'],
      limit: ['rgba(255,142,127,0.16)', '#FF8E7F'],
      birka: ['rgba(61,220,151,0.14)', '#3DDC97']
    };
    const kind = (src) => ({ pay: src === 'pay', import: src === 'import', limit: src === 'limit', birka: src === 'birka', tileBg: tiles[src][0], tileInk: tiles[src][1] });
    const matches = (src) => filter === 'all' || filter === src;
    // What came since the person last looked: a payment that waits today and
    // the statement imported last night. Each leads where it is dealt with.
    const fresh = [
      { src: 'pay', title: 'Аренда · 45 000 ₽', line: 'Сегодня, ждёт подтверждения', time: '9:00', href: 'Notify-Tap.dc.html' },
      { src: 'limit', title: 'Досуг · больше лимита', line: 'На 1 300 ₽ · после выписки', time: 'вчера', href: 'Limits-Page.dc.html' },
      { src: 'import', title: 'Альфа-Банк · ноябрь', line: '3 из 34 ждут во «Входящих»', time: 'вчера', href: 'Inbox-Phone.dc.html' }
    ];
    // The history is a list by days, as the operations are. A row says what
    // came and, under it in the color of the news, what became of it: green
    // went through, amber still waits for the person, grey was skipped or
    // only tells something. A row leads where its thing lives; the news of
    // Birka leads nowhere yet. `tall` is the height of the row.
    const inks = { done: '#3DDC97', wait: '#FBBF24', over: '#FF8E7F', skip: '#8A8A8A', info: '#A3A3A3' };
    const row = (src, title, line, tone, time, href, tall) => ({ src, title, line, time, href: href ?? '', link: href != null, plain: href == null, lineInk: inks[tone], tall, ...kind(src) });
    const history = [
      { day: 'Сегодня', fresh: true, items: [row('pay', 'Аренда · 45 000 ₽', 'Ждёт подтверждения', 'wait', '9:00', 'Notify-Tap.dc.html', 68)] },
      { day: 'Вчера', fresh: true, items: [row('limit', 'Досуг · больше лимита', 'На 1 300 ₽ · после выписки', 'over', '21:40', 'Limits-Page.dc.html', 68), row('import', 'Альфа-Банк · ноябрь', '3 из 34 ждут во «Входящих»', 'wait', '21:40', 'Inbox-Phone.dc.html', 68)] },
      { day: '12 ноября', items: [row('limit', 'Кафе · 80 % лимита', 'Осталось 2 400 ₽ · после выписки', 'wait', '20:05', 'Limits-Page.dc.html', 68)] },
      { day: '5 ноября', items: [row('pay', 'Зарплата · +120 000 ₽', 'Провели в 9:14', 'done', '9:00', 'Future-Planned.dc.html', 68)] },
      { day: '3 ноября', items: [row('pay', 'Спортзал · 3 500 ₽', 'Пропустили · следующий 3 декабря', 'skip', '9:00', 'Future-Planned.dc.html', 68)] },
      { day: '2 ноября', items: [row('birka', 'Birka 0.2', 'Напоминания о платежах и свой календарь «Birka»', 'info', '18:00', null, 80)] },
      { day: '1 ноября', items: [row('pay', 'Netflix · 799 ₽', 'Провёлся сам', 'done', '9:00', 'Future-Planned.dc.html', 68)] },
      { day: '28 октября', items: [row('import', 'Интернет · 650 ₽', 'Нашли в выписке · добавили в регулярные', 'done', '20:12', 'Future-Planned.dc.html', 80)] }
    ];
    const unread = read ? {} : { all: 3, pay: 1, limit: 1, import: 1 };
    const filters = [['all', 'Все'], ['pay', 'Платежи'], ['limit', 'Лимиты'], ['import', 'Импорт'], ['birka', 'Birka']].map(([id, label]) => {
      const on = filter === id;
      const n = unread[id] ?? 0;
      return {
        label,
        selected: on ? 'true' : 'false',
        bg: on ? '#F4F4F2' : 'rgba(255,255,255,0.07)',
        fg: on ? '#000000' : '#C9C9C7',
        count: n > 0 ? String(n) : '',
        countW: n > 0 ? '28px' : '0px',
        countGap: n > 0 ? '6px' : '0px',
        countO: n > 0 ? '1' : '0',
        countBg: on ? 'rgba(0,0,0,0.10)' : 'rgba(61,220,151,0.18)',
        countInk: on ? '#000000' : '#3DDC97',
        countTr: reduced ? 'none' : 'max-width 320ms ' + ease + ', margin-left 320ms ' + ease + ', opacity 220ms ' + fade,
        pick: () => this.setState({ filter: id })
      };
    });
    const freshShown = fresh.filter((it) => matches(it.src));
    const freshOpen = !read && freshShown.length > 0;
    return {
      empty,
      hasAny: !empty,
      filters,
      readAll: () => this.setState({ read: true }),
      fresh: {
        title: 'Новые · ' + freshShown.length,
        items: freshShown.map((it, i) => ({
          ...it,
          ...kind(it.src),
          divider: i < freshShown.length - 1 ? '1px solid rgba(255,255,255,0.08)' : '0',
          dotO: read ? '0' : '1',
          dotTr: reduced ? 'none' : 'opacity 220ms ' + fade
        })),
        // The dots go out first, then the group closes and the history
        // opens «Сегодня» and «Вчера» with the two rows in them.
        height: freshOpen ? (57 + 69 * freshShown.length) + 'px' : '0px',
        o: freshOpen ? '1' : '0',
        pull: freshOpen ? '0px' : '-18px',
        tr: reduced ? 'none' : 'max-height 320ms ' + ease + ' 120ms, opacity 220ms ' + fade + ' 120ms, margin-bottom 320ms ' + ease + ' 120ms'
      },
      days: history.map((d) => {
        const items = d.items.filter((m) => matches(m.src));
        const shown = items.length > 0 && (!d.fresh || read);
        // As tall as the day is, so that it opens and closes in step.
        const tall = 28 + items.reduce((sum, m) => sum + m.tall + 1, 0);
        return {
          day: d.day,
          items: items.map((m, i) => ({ ...m, divider: i < items.length - 1 ? '1px solid rgba(255,255,255,0.08)' : '0' })),
          height: shown ? tall + 'px' : '0px',
          pad: shown ? '18px' : '0px',
          o: shown ? '1' : '0',
          tr: reduced ? 'none' : 'max-height 320ms ' + ease + ' 220ms, padding-top 320ms ' + ease + ' 220ms, opacity 220ms ' + fade + ' 260ms'
        };
      })
    };
  }
}
</script>
</body>
</html>
