<script type="text/x-dc" data-dc-script data-props='{"slow":{"editor":"boolean","default":false},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'rest' };
    this.timer = null;
    this.start = 0;
    this.slowSeen = null;
    this.stopped = false;
  }

  componentDidMount() {
    this.stopped = false;
    this.clock();
  }

  componentDidUpdate() {
    this.clock();
  }

  componentWillUnmount() {
    this.stopped = true;
    clearTimeout(this.timer);
    this.timer = null;
  }

  steps() {
    return [['rest', 1400, 260], ['tap', 80, 140], ['saved', 1800, 560], ['toastOut', 600, 220], ['fadeOut', 40, 260], ['reset', 90, 0]];
  }

  active() {
    return !this.stopped && (!this.__host || this.__host.logic === this);
  }

  phaseAt(elapsed) {
    const k = this.props.slow ? 3 : 1;
    const steps = this.steps();
    const total = steps.reduce((sum, s) => sum + s[1] + s[2] * k, 0);
    let t = elapsed % total;
    for (const s of steps) {
      const d = s[1] + s[2] * k;
      if (t < d) return s[0];
      t -= d;
    }
    return steps[0][0];
  }

  clock() {
    const slow = !!this.props.slow;
    if (slow !== this.slowSeen) {
      this.slowSeen = slow;
      this.start = Date.now();
    }
    if (this.timer || !this.active()) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (!this.active()) return;
      const phase = this.phaseAt(Date.now() - this.start);
      if (phase !== this.state.phase) this.setState({ phase });
      this.clock();
    }, 40);
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  renderVals() {
    this.clock();
    const k = this.props.slow ? 3 : 1;
    const reduced = this.props.reducedMotion ?? this.prefersReduced();
    const phase = this.state.phase;
    const saved = phase === 'saved' || phase === 'toastOut' || phase === 'fadeOut';
    const reset = phase === 'reset';
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const ms = (x) => Math.round(x * k) + 'ms';
    let toast = { y: reduced ? 0 : 120, o: 0, tr: 'none' };
    if (phase === 'saved') toast = { y: 0, o: 1, tr: reduced ? 'opacity ' + ms(220) + ' ease' : 'transform ' + ms(560) + ' ' + spring + ', opacity ' + ms(200) + ' ease' };
    if (phase === 'toastOut' || phase === 'fadeOut') toast = { y: reduced ? 0 : 16, o: 0, tr: reduced ? 'opacity ' + ms(200) + ' ease' : 'transform ' + ms(220) + ' ' + ease + ', opacity ' + ms(200) + ' ease' };
    return {
      all: { o: phase === 'fadeOut' || reset ? 0 : 1, tr: 'opacity ' + ms(260) + ' ease' },
      sub: { old: saved ? 0 : 1, now: saved ? 1 : 0, tr: reset ? 'none' : 'opacity ' + ms(220) + ' ' + ease },
      toast,
      tap: { o: phase === 'tap' ? 1 : 0, t: phase === 'tap' ? 'scale(1)' : 'scale(0.6)', tr: 'opacity ' + ms(140) + ' ease-out, transform ' + ms(140) + ' ease-out' }
    };
  }
}
</script>
