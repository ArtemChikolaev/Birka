<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["Есть долги", "Долгов нет"], "default": "Есть долги"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {};
    this.lines = {};
    this.timers = [];
    this.box = null;
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  renderVals() {
    const mode = this.props.state ?? 'Есть долги';
    const reduced = this.prefersReduced();
    // The row says what the debts come to in the base currency, the dollars
    // of Дима at today's rate; with none it says what the page is for.
    const line = mode === 'Есть долги' ? 'Мне должны 12 768 ₽ · мои 4 000 ₽' : 'Кто кому должен и до какого дня';
    return { line: this.fading('line', line, reduced) };
  }
}
