box; border-radius: 16px; border: {{edge.transport}}; background: #0E0E0F; color: #F4F4F2; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; transition: border-color 150ms cubic-bezier(0.2, 0, 0, 1)"><span style="display: flex; color: #60A5FA"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="13" rx="3"></rect><path d="M5 11h14"></path><path d="M8 17v3M16 17v3"></path><path d="M8.5 14h.01M15.5 14h.01"></path></svg></span><span style="max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Транспорт</span></button><button type="button" onClick="{{pick.travel}}" aria-pressed="{{on.travel}}" aria-label="Поездки" style="height: 68px; box-sizing: border-box; border-radius: 16px; border: {{edge.travel}}; background: #0E0E0F; color: #F4F4F2; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; transition: border-color 150ms cubic-bezier(0.2, 0, 0, 1)"><span style="display: flex; color: #60A5FA"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7 3 3 7z"></path><path d="M10 13.5 21 3"></path></svg></span><span style="max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Поездки</span></button><button type="button" onClick="{{pick.leisure}}" aria-pressed="{{on.leisure}}" aria-label="Досуг" style="height: 68px; box-sizing: border-box; border-radius: 16px; border: {{edge.leisure}}; background: #0E0E0F; color: #F4F4F2; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; transition: border-color 150ms cubic-bezier(0.2, 0, 0, 1)"><span style="display: flex; color: #FB923C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"></rect><path d="M9 6v12M15 6v12"></path></svg></span><span style="max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Досуг</span></button><button type="button" onClick="{{pick.gifts}}" aria-pressed="{{on.gifts}}" aria-label="Подарки" style="height: 68px; box-sizing: border-box; border-radius: 16px; border: {{edge.gifts}}; background: #0E0E0F; color: #F4F4F2; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; transition: border-color 150ms cubic-bezier(0.2, 0, 0, 1)"><span style="display: flex; color: #FB7185"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="16" height="11" rx="2"></rect><path d="M12 9v11M4 13h16"></path><path d="M12 9S10.5 4 8 4.5 7.5 9 12 9zm0 0s1.5-5 4-4.5S16.5 9 12 9z"></path></svg></span><span style="max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Подарки</span></button><button type="button" onClick="{{pick.subs}}" aria-pressed="{{on.subs}}" aria-label="Подписки" style="height: 68px; box-sizing: border-box; border-radius: 16px; border: {{edge.subs}}; background: #0E0E0F; color: #F4F4F2; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; transition: border-color 150ms cubic-bezier(0.2, 0, 0, 1)"><span style="display: flex; color: #22D3EE"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12.5" rx="2.5"></rect><path d="M10.2 8.9v5l4.2-2.5z"></path><path d="M8 20.5h8"></path></svg></span><span style="max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Подписки</span></button><span style="height: 68px; box-sizing: border-box; border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); background: #0E0E0F; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="display: flex; color: #A3A3A3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="18" cy="12" r="1.3"></circle></svg></span>Ещё</span>
        </div>

<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["Идёт поездка", "Без поездки"], "default": "Идёт поездка"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
    this.lines = {};
    this.timers = [];
  }

  fresh() {
    return { kind: 'expense', expr: '46', cat: 'cafe', day: 'today', phase: 'open' };
  }

  componentDidUpdate(prev) {
    if (prev.state !== this.props.state) {
      this.stop();
      this.setState(this.fresh());
    }
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  evaluate(expr) {
    const tokens = expr.match(/\d+(,\d*)?|[+−×÷]/g) || ['0'];
    const values = [];
    const ops = [];
    for (const token of tokens) {
      if ('+−×÷'.includes(token)) ops.push(token);
      else values.push(parseFloat(token.replace(',', '.')) || 0);
    }
    for (let i = 0; i < ops.length; ) {
      if (ops[i] === '×' || ops[i] === '÷') {
        const right = values[i + 1] ?? 0;
        values[i] = ops[i] === '×' ? values[i] * right : (right === 0 ? 0 : values[i] / right);
        values.splice(i + 1, 1);
        ops.splice(i, 1);
      } else i++;
    }
    let total = values[0] ?? 0;
    ops.forEach((op, i) => {
      total = op === '+' ? total + (values[i + 1] ?? 0) : total - (values[i + 1] ?? 0);
    });
    return total;
  }

  press(key) {
    const { expr } = this.state;
    const last = expr.slice(-1);
    const isOp = (c) => '+−×÷'.includes(c);
    let next = expr;
    if (key === '⌫') next = expr.length > 1 ? expr.slice(0, -1) : '0';
    else if (isOp(key)) next = isOp(last) ? expr.slice(0, -1) + key : expr + key;
    else if (key === ',') {
      const number = expr.split(/[+−×÷]/).pop();
      if (!number.includes(',')) next = expr + (number === '' ? '0,' : ',');
    } else next = expr === '0' ? key : expr + key;
    this.setState({ expr: next });
  }

  renderVals() {
    const mode = this.props.state ?? 'Идёт поездка';
    const st = this.state;
    const reduced = this.prefersReduced();
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    const sheetCurve = 'cubic-bezier(0.32, 0.72, 0, 1)';

    // Today is Thursday, 12 November 2026, the last day of the trip to
    // Tbilisi (3–12 November). An expense on a day of the trip gets its
    // метка by itself; a day out of the trip, an income or a transfer
    // offers «+ Метка» instead. The two chips cross-fade over duration.base.
    const trip = mode === 'Идёт поездка';
    const inTrip = trip && st.kind === 'expense' && st.day !== 'earlier';
    const total = this.evaluate(st.expr);
    const sign = st.kind === 'expense' ? '−' : st.kind === 'income' ? '+' : '';
    const names = { cafe: 'Кафе', groceries: 'Продукты', transport: 'Транспорт', travel: 'Поездки', leisure: 'Досуг', gifts: 'Подарки', subs: 'Подписки' };
    const pick = {};
    const on = {};
    const edge = {};
    for (const id of Object.keys(names)) {
      pick[id] = () => this.setState({ cat: id });
      on[id] = st.cat === id ? 'true' : 'false';
      edge[id] = st.cat === id ? '2px solid #3DDC97' : '1px solid rgba(255,255,255,0.09)';
    }
    const kinds = [['expense', 'РАСХОД'], ['income', 'ДОХОД'], ['transfer', 'ПЕРЕВОД']].map(([id, label]) => ({
      label,
      pick: () => this.setState({ kind: id }),
      pressed: st.kind === id ? 'true' : 'false',
      bg: st.kind === id ? '#1E1E1F' : 'transparent',
      fg: st.kind === id ? '#F4F4F2' : '#8A8A8A'
    }));
    const days = [['today', 'Сегодня'], ['yesterday', 'Вчера']].map(([id, label]) => ({
      label,
      pick: () => this.setState({ day: id }),
      pressed: st.day === id ? 'true' : 'false',
      bg: st.day === id ? '#F4F4F2' : '#161617',
      fg: st.day === id ? '#000000' : '#C9C9C7'
    }));
    const keyNames = { '÷': 'Разделить', '×': 'Умножить', '−': 'Вычесть', '+': 'Прибавить', ',': 'Запятая', '⌫': 'Стереть' };
    const keys = ['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', ',', '0', '⌫', '+'].map((label) => ({
      label,
      name: keyNames[label] ?? label,
      press: () => this.press(label),
      bg: '+−×÷⌫'.includes(label) ? '#161617' : '#0E0E0F',
      fg: '+−×÷'.includes(label) ? '#3DDC97' : '#F4F4F2'
    }));
    const saving = st.phase === 'saving';
    const save = {
      l: saving && !reduced ? '147px' : '0px',
      w: saving && !reduced ? '56px' : '350px',
      tr: 'left 320ms ' + ease + ', width 320ms ' + ease,
      textO: saving ? '0' : '1',
      textTr: 'opacity 150ms ' + fade,
      checkO: saving ? '1' : '0',
      checkT: saving || reduced ? 'scale(1)' : 'scale(0.4)',
      checkTr: saving ? 'opacity 220ms ' + fade + ' 180ms, transform 320ms ' + spring + ' 180ms' : 'none'
    };
    const toasts = {
      hidden: { o: '0', y: reduced ? '0px' : '120px', tr: 'none' },
      shown: { o: '1', y: '0px', tr: reduced ? 'opacity 220ms ' + fade : 'transform 560ms ' + spring + ', opacity 200ms ' + fade },
      gone: { o: '0', y: reduced ? '0px' : '16px', tr: reduced ? 'opacity 220ms ' + fade : 'transform 220ms ' + ease + ', opacity 220ms ' + fade }
    };

    return {
      kinds,
      days,
      keys,
      pick,
      on,
      edge,
      transfer: st.kind === 'transfer',
      notTransfer: st.kind !== 'transfer',
      earlier: st.day === 'earlier',
      notEarlier: st.day !== 'earlier',
      pickEarlier: () => this.setState({ day: 'earlier' }),
      pickToday: () => this.setState({ day: 'today' }),
      tag: {
        on: inTrip ? '1' : '0',
        off: inTrip ? '0' : '1',
        scale: inTrip || reduced ? '1' : '0.92',
        tr: reduced ? 'opacity 220ms ' + fade : 'opacity 220ms ' + ease + ', transform 320ms ' + spring,
        aria: inTrip ? 'Метка: Тбилиси' : 'Добавить метку',
        // The place of the chip follows its width, so «+ Заметка» moves up
        // with it instead of keeping a gap.
        w: inTrip ? '121px' : '94px',
        wTr: reduced ? 'none' : 'width 220ms ' + ease
      },
      exprLine: /[+−×÷]/.test(st.expr) ? st.expr.replace(/([+−×÷])/g, ' $1 ') : '',
      amount: sign + total.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₾',
      saveLabel: st.kind === 'transfer' ? 'СОХРАНИТЬ · НАЛИЧНЫЕ ЛАРИ' : 'СОХРАНИТЬ · ' + names[st.cat].toUpperCase(),
      save,
      saveNow: () => {
        if (st.phase !== 'open') return;
        this.setState({ phase: 'saving' });
        this.later(900, { phase: 'gone' });
        this.timers.push(setTimeout(() => this.setState(this.fresh()), 2200));
      },
      sheet: {
        t: st.phase === 'gone' ? 'translateY(105%)' : 'translateY(0px)',
        tr: 'transform ' + (st.phase === 'gone' ? 300 : 460) + 'ms ' + sheetCurve
      }
    };
  }
}
</script>
</body>
