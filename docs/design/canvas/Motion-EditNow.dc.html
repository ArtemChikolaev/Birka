<script type="text/x-dc" data-dc-script data-props='{"slow":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'page' };
    this.timer = null;
    this.start = 0;
    this.slowSeen = null;
    this.stopped = false;
  }

  componentDidMount() {
    this.stopped = false;
    this.clock();
  }

  componentDidUpdate() {
    this.clock();
  }

  componentWillUnmount() {
    this.stopped = true;
    clearTimeout(this.timer);
    this.timer = null;
  }

  steps() {
    return [['page', 1100, 500], ['tap', 80, 140], ['form', 2000, 500], ['tapBack', 80, 140]];
  }

  active() {
    return !this.stopped && (!this.__host || this.__host.logic === this);
  }

  phaseAt(elapsed) {
    const k = this.props.slow ? 3 : 1;
    const steps = this.steps();
    const total = steps.reduce((sum, s) => sum + s[1] + s[2] * k, 0);
    let t = elapsed % total;
    for (const s of steps) {
      const d = s[1] + s[2] * k;
      if (t < d) return s[0];
      t -= d;
    }
    return steps[0][0];
  }

  clock() {
    const slow = !!this.props.slow;
    if (slow !== this.slowSeen) {
      this.slowSeen = slow;
      this.start = Date.now();
    }
    if (this.timer || !this.active()) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (!this.active()) return;
      const phase = this.phaseAt(Date.now() - this.start);
      if (phase !== this.state.phase) this.setState({ phase });
      this.clock();
    }, 40);
  }

  renderVals() {
    this.clock();
    const k = this.props.slow ? 3 : 1;
    const phase = this.state.phase;
    const open = phase === 'form' || phase === 'tapBack';
    const tapOn = phase === 'tap' || phase === 'tapBack';
    const curve = open ? 'cubic-bezier(0.35, 0.91, 0.33, 0.97)' : 'cubic-bezier(0.67, 0.03, 0.65, 0.09)';
    return {
      form: { t: open ? 'translateY(0%)' : 'translateY(100%)', tr: 'transform ' + 500 * k + 'ms ' + curve },
      tap: { o: tapOn ? 1 : 0, t: tapOn ? 'scale(1)' : 'scale(0.6)', tr: 'opacity ' + 140 * k + 'ms ease-out, transform ' + 140 * k + 'ms ease-out' }
    };
  }
}
