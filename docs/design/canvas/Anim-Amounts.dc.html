<script type="text/x-dc" data-dc-script data-props='{"slow":{"editor":"boolean","default":false},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'rest' };
    this.timer = null;
    this.start = 0;
    this.slowSeen = null;
    this.stopped = false;
  }

  componentDidMount() {
    this.stopped = false;
    this.clock();
  }

  componentDidUpdate() {
    this.clock();
  }

  componentWillUnmount() {
    this.stopped = true;
    clearTimeout(this.timer);
    this.timer = null;
  }

  steps() {
    return [['rest', 1400, 260], ['tapPlus', 80, 140], ['spend', 0, 560], ['spendCalm', 1000, 400], ['tapEye', 80, 140], ['hidden', 1400, 300], ['tapEye2', 80, 140], ['shown', 900, 300], ['tapPlus2', 80, 140], ['earn', 0, 560], ['earnCalm', 1300, 400], ['fadeOut', 40, 260], ['reset', 90, 0]];
  }

  active() {
    return !this.stopped && (!this.__host || this.__host.logic === this);
  }

  phaseAt(elapsed) {
    const k = this.props.slow ? 3 : 1;
    const steps = this.steps();
    const total = steps.reduce((sum, s) => sum + s[1] + s[2] * k, 0);
    let t = elapsed % total;
    for (const s of steps) {
      const d = s[1] + s[2] * k;
      if (t < d) return s[0];
      t -= d;
    }
    return steps[0][0];
  }

  clock() {
    const slow = !!this.props.slow;
    if (slow !== this.slowSeen) {
      this.slowSeen = slow;
      this.start = Date.now();
    }
    if (this.timer || !this.active()) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (!this.active()) return;
      const phase = this.phaseAt(Date.now() - this.start);
      if (phase !== this.state.phase) this.setState({ phase });
      this.clock();
    }, 40);
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  renderVals() {
    this.clock();
    const k = this.props.slow ? 3 : 1;
    const reduced = this.props.reducedMotion ?? this.prefersReduced();
    const phase = this.state.phase;
    const earned = ['earn', 'earnCalm', 'fadeOut'].indexOf(phase) !== -1;
    const added = earned || ['spend', 'spendCalm', 'tapEye', 'hidden', 'tapEye2', 'shown', 'tapPlus2'].indexOf(phase) !== -1;
    const hidden = phase === 'hidden' || phase === 'tapEye2';
    const reset = phase === 'reset';
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    // A figure takes the color of what its change means while it rolls, and
    // turns white once it settles: red for worse, green for better.
    const red = '#FF8E7F';
    const green = '#3DDC97';
    const white = '#F4F4F2';
    const flashing = phase === 'spend' || phase === 'earn';
    const ms = (x) => Math.round(x * k) + 'ms';
    const colorTr = reset ? 'none' : 'color ' + ms(flashing ? 150 : 320) + ' ' + fade;
    const roll = reset || reduced ? 'none' : 'transform ' + ms(520) + ' ' + ease;
    const C = 238.76;
    const share = 0.4118;
    const dot = (on) => ({ o: on ? 1 : 0, t: on ? 'scale(1)' : 'scale(0.6)', tr: 'opacity ' + ms(140) + ' ease-out, transform ' + ms(140) + ' ease-out' });
    return {
      all: { o: phase === 'fadeOut' || reset ? 0 : 1, tr: 'opacity ' + ms(260) + ' ease' },
      cap: { y: added && !earned ? -52 : -312, tr: roll },
      card: { y: added && !earned ? -36 : -216, tr: roll },
      delta: { y: added && !earned ? -240 : -90, tr: roll },
      spent: { y: added ? -256 : -96, tr: roll },
      wealth: { c: phase === 'spend' ? red : phase === 'earn' ? green : white, tr: colorTr },
      spending: { c: phase === 'spend' ? red : white, tr: colorTr },
      hide: { f: hidden ? 'blur(8px)' : 'blur(0px)', o: hidden ? 0 : 1, tr: reset ? 'none' : 'filter ' + ms(260) + ' ' + ease + ', opacity ' + ms(260) + ' ' + ease },
      dots: { o: hidden ? 1 : 0, tr: reset ? 'none' : 'opacity ' + ms(220) + ' ' + ease + ' ' + ms(hidden ? 80 : 0) },
      ring: {
        a1: (added ? share * C - 2 : C).toFixed(1) + ' ' + C,
        a2: (added ? (1 - share) * C - 2 : 0).toFixed(1) + ' ' + C,
        tr: reset ? 'none' : 'stroke-dasharray ' + ms(520) + ' ' + ease
      },
      legend: { h: added ? 24 : 0, o: added ? 1 : 0, tr: reset ? 'none' : 'height ' + ms(320) + ' ' + ease + ', opacity ' + ms(240) + ' ' + ease + ' ' + ms(80) },
      tapPlus: dot(phase === 'tapPlus' || phase === 'tapPlus2'),
      tapEye: dot(phase === 'tapEye' || phase === 'tapEye2')
    };
  }
}
