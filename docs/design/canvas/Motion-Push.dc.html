<script type="text/x-dc" data-dc-script data-props='{"slow":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'list' };
    this.timer = null;
    this.start = 0;
    this.slowSeen = null;
    this.stopped = false;
  }

  componentDidMount() {
    this.stopped = false;
    this.clock();
  }

  componentDidUpdate() {
    this.clock();
  }

  componentWillUnmount() {
    this.stopped = true;
    clearTimeout(this.timer);
    this.timer = null;
  }

  steps() {
    return [['list', 1300, 0], ['tap', 80, 140], ['push', 1500, 500], ['grab', 120, 140], ['drag', 50, 600], ['pop', 800, 300]];
  }

  active() {
    return !this.stopped && (!this.__host || this.__host.logic === this);
  }

  phaseAt(elapsed) {
    const k = this.props.slow ? 3 : 1;
    const steps = this.steps();
    const total = steps.reduce((sum, s) => sum + s[1] + s[2] * k, 0);
    let t = elapsed % total;
    for (const s of steps) {
      const d = s[1] + s[2] * k;
      if (t < d) return s[0];
      t -= d;
    }
    return steps[0][0];
  }

  clock() {
    const slow = !!this.props.slow;
    if (slow !== this.slowSeen) {
      this.slowSeen = slow;
      this.start = Date.now();
    }
    if (this.timer || !this.active()) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (!this.active()) return;
      const phase = this.phaseAt(Date.now() - this.start);
      if (phase !== this.state.phase) this.setState({ phase });
      this.clock();
    }, 40);
  }

  renderVals() {
    this.clock();
    const k = this.props.slow ? 3 : 1;
    const phase = this.state.phase;
    const pushed = phase === 'push' || phase === 'grab';
    const drag = phase === 'drag';
    const dragCurve = 'cubic-bezier(0.45, 0, 0.55, 1)';
    let ms = 0;
    let curve = 'cubic-bezier(0.2, 0, 0, 1)';
    if (pushed) {
      ms = 500;
      curve = 'cubic-bezier(0.35, 0.91, 0.33, 0.97)';
    }
    if (drag) {
      ms = 600;
      curve = dragCurve;
    }
    if (phase === 'pop') ms = 300;
    const tr = (props) => props.map((p) => p + ' ' + ms * k + 'ms ' + curve).join(', ');
    let pageX = '100%';
    let listX = '0%';
    let shade = 0;
    if (pushed) {
      pageX = '0%';
      listX = '-30%';
      shade = 0.3;
    }
    if (drag) {
      pageX = '47%';
      listX = '-16%';
      shade = 0.16;
    }
    const covering = pushed || drag;
    const fingerOn = phase === 'grab' || drag;
    const tapOn = phase === 'tap';
    return {
      list: { t: 'translateX(' + listX + ')', tr: tr(['transform']) },
      shade: { o: shade, tr: tr(['opacity']) },
      page: { t: 'translateX(' + pageX + ')', s: covering ? '-16px 0 32px rgba(0,0,0,0.55)' : '-16px 0 32px rgba(0,0,0,0)', tr: tr(['transform', 'box-shadow']) },
      finger: { x: drag || phase === 'pop' ? 187 : 6, o: fingerOn ? 1 : 0, tr: 'left ' + (drag ? 600 * k : 0) + 'ms ' + dragCurve + ', opacity ' + 140 * k + 'ms ease-out' },
      tap: { o: tapOn ? 1 : 0, t: tapOn ? 'scale(1)' : 'scale(0.6)', tr: 'opacity ' + 140 * k + 'ms ease-out, transform ' + 140 * k + 'ms ease-out' }
    };
  }
}
</script>
