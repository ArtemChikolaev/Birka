<body>
<x-dc>
<helmet>

</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #F4F4F2; font-family: Inter, system-ui, sans-serif; font-size: 15px; background: #000000">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; transform-origin: 50% 0%; background: radial-gradient(62% 34% at 0% 0%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(66% 38% at 100% 100%, rgba(36,138,86,0.30) 0%, transparent 74%), radial-gradient(60% 20% at 0% 55%, rgba(36,138,86,0.18) 0%, transparent 72%), #000000; transform: {{page.t}}; border-radius: {{page.r}}; transition: {{page.tr}}"><div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 40px">
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; align-items: center; height: 44px"><a href="Debts-List.dc.html" aria-label="Назад" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F4F4F2; text-decoration: none; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><h1 style="margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Долг</h1><span style="justify-self: end; display: flex"><a href="People-Edit.dc.html" style="height: 44px; padding: 0 16px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; background: rgba(255,255,255,0.08); color: #F4F4F2; text-decoration: none; font-size: 15px; font-weight: 600">Изменить</a></span></div>

      <section aria-label="Долг" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 2px; text-align: center">
        <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 22px; background: rgba(167,139,250,0.16); color: #A78BFA; display: flex; align-items: center; justify-content: center; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 30px">И</span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 700">Иван</span><span style="font-size: 14px; color: #A3A3A3">коллега из бухгалтерии</span></span>
        <span style="font-family: Manrope, Inter, sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">2 000 ₽</span>
        <span style="font-size: 15px; color: #A3A3A3">{{line}}</span>
      </section>

      <section aria-label="Сколько вернули" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 22px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <span style="font-weight: 600">{{progress}}</span>
          <span style="font-size: 13px; color: #A3A3A3; font-variant-numeric: tabular-nums">0%</span>
        </div>
        <span aria-hidden="true" style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08)"></span>
        <span style="display: flex; align-items: center; gap: 8px; padding-top: 4px; font-size: 14px; color: #C9C9C7"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15.5 6 9.5z"></path><path d="M10 20.5a2.2 2.2 0 0 0 4 0"></path></svg>{{due}}</span>
      </section>

      <div style="display: flex; gap: 12px">
        <a href="Debt-Return.dc.html" style="flex: 1 1 0; min-width: 0; height: 84px; box-sizing: border-box; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); color: #3DDC97"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg><span>{{actions.main}}</span></a>
        <a href="Debt-Form.dc.html" style="flex: 1 1 0; min-width: 0; height: 84px; box-sizing: border-box; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); color: #F4F4F2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>{{actions.more}}</span></a>
        <sc-if value="{{remindShown}}" hint-placeholder-val="{{ true }}"><a href="People-Remind.dc.html" style="flex: 1 1 0; min-width: 0; height: 84px; box-sizing: border-box; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); color: #F4F4F2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17.5H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 3.5z"></path><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"></path></svg><span>Напомнить</span></a></sc-if>
      </div>

      <section aria-label="История" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">История</h2>
        <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40)">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 0">
            <span aria-hidden="true" style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; background: {{step.tint}}; color: {{step.ink}}; display: grid"><span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{step.outO}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9"></path><path d="M7 14l5-5 5 5"></path><path d="M5 4h14"></path></svg></span><span style="grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; opacity: {{step.inO}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></span></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{step.title}}</span><span style="font-size: 13px; line-height: 1.35; color: #A3A3A3">{{step.line}}</span></span>
            <span style="flex: 0 0 auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{step.amount}}</span>
          </div>
        </div>
      </section>
    </div><div style="position: absolute; inset: 0; background: #000000; opacity: {{shade.o}}; transition: {{shade.tr}}"></div></div>
  <div role="dialog" aria-modal="true" aria-label="Напомнить" style="position: absolute; left: 0; right: 0; top: 52px; bottom: 0; box-sizing: border-box; border-radius: 22px 22px 0 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); border-bottom: 0; background: radial-gradient(70% 30% at 100% 0%, rgba(36,138,86,0.26) 0%, transparent 72%), radial-gradient(60% 26% at 0% 100%, rgba(36,138,86,0.22) 0%, transparent 72%), #050706; box-shadow: 0 -12px 40px rgba(0,0,0,0.6); top: 236px; transform: {{sheet.t}}; transition: {{sheet.tr}}">
    <div style="position: absolute; left: 20px; right: 12px; top: 20px; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px"><h2 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Напомнить</h2><button type="button" onClick="{{close}}" aria-label="Закрыть" style="flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #F4F4F2; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
    <div style="position: absolute; left: 0; right: 0; top: 76px; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 0">
      <div style="border-radius: 22px; padding: 2px 14px; background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 28px rgba(0,0,0,0.40); display: flex; align-items: center; gap: 12px; min-height: 66px">
        <span aria-hidden="true" style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; background: rgba(167,139,250,0.16); color: #A78BFA; display: flex; align-items: center; justify-content: center; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 15px">И</span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Иван · коллега из бухгалтерии</span><span style="font-size: 13px; color: {{to.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{to.line}}</span></span>
      </div>
      <label style="display: flex; flex-direction: column; gap: 8px"><span style="padding: 0 4px; font-size: 13px; color: #A3A3A3">Сообщение</span>
        <textarea rows="4" style="box-sizing: border-box; width: 100%; min-height: 124px; padding: 14px 18px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: #0E0E0F; color: #F4F4F2; font: inherit; font-size: 17px; line-height: 1.45; resize: none; outline: none">Привет! Напоминаю про 2 000 ₽ — договаривались вернуть до 20 ноября.</textarea>
      </label>
      <span style="padding: 0 4px; font-size: 13px; line-height: 1.45; color: #A3A3A3">{{caption}}</span>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 52px; display: flex; flex-direction: column; gap: 12px">
      <button type="button" onClick="{{send}}" style="height: 56px; border: 0; border-radius: 28px; background: #3DDC97; color: #04130B; font: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; box-shadow: 0 10px 30px rgba(61,220,151,0.28); cursor: pointer">{{primary}}</button>
      <sc-if value="{{hasSecondary}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{send}}" style="height: 56px; border: 0; border-radius: 28px; background: #161617; color: #F4F4F2; font: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; cursor: pointer; width: 100%">ДРУГОЕ ПРИЛОЖЕНИЕ</button></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["С номером", "Без номера"], "default": "С номером"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
    this.lines = {};
    this.timers = [];
    this.box = null;
  }
  componentDidUpdate(prev) {
    if (prev.state !== this.props.state) {
      this.stop();
      this.setState({ open: true });
    }
  }

  stop() {
    this.timers.forEach((timer) => clearTimeout(timer));
    this.timers = [];
  }

  later(ms, change) {
    this.timers.push(setTimeout(() => this.setState(change), ms));
  }

  componentWillUnmount() {
    this.stop();
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  fading(key, text, reduced) {
    const seen = this.lines[key];
    if (!seen) {
      this.lines[key] = { a: text, b: '', front: 'a' };
    } else if ((seen.front === 'a' ? seen.a : seen.b) !== text) {
      if (seen.front === 'a') {
        seen.b = text;
        seen.front = 'b';
      } else {
        seen.a = text;
        seen.front = 'a';
      }
    }
    const s = this.lines[key];
    return {
      a: s.a,
      b: s.b,
      oa: s.front === 'a' ? '1' : '0',
      ob: s.front === 'b' ? '1' : '0',
      tr: reduced ? 'none' : 'opacity 220ms cubic-bezier(0.2, 0, 0, 1)'
    };
  }

  renderVals() {
    const reduced = this.prefersReduced();
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    const sheetCurve = 'cubic-bezier(0.32, 0.72, 0, 1)';

    const mine = false;
    const cardVals = mine
      ? {
          line: 'осталось отдать из 2 000 ₽',
          progress: 'Отдали 0 ₽',
          due: 'Срок 20 ноября · через 6 дней',
          actions: { main: 'Отдать', more: 'Занять ещё' },
          remindShown: false,
          step: { title: 'Заняли', line: '10 ноября · на Зарплатную карту · до зарплаты', amount: '+2 000 ₽', tint: 'rgba(61,220,151,0.14)', ink: '#3DDC97', outO: '0', inO: '1' }
        }
      : {
          line: 'осталось вернуть вам из 2 000 ₽',
          progress: 'Вернули 0 ₽',
          due: 'Срок 20 ноября · напомним в этот день',
          actions: { main: 'Возврат', more: 'Ещё в долг' },
          remindShown: true,
          step: { title: 'В долг', line: '10 ноября · с Зарплатной карты · на подарок', amount: '−2 000 ₽', tint: 'rgba(255,255,255,0.08)', ink: '#D6D6D4', outO: '1', inO: '0' }
        };
    // With a number the message goes by SMS to it, or into another app
    // through the system window of sharing; without one, only the latter.
    const phone = (this.props.state ?? 'С номером') === 'С номером';
    const open = this.state.open;
    return {
      ...cardVals,
      to: phone
        ? { line: '+7 999 123-45-67 · мобильный', ink: '#A3A3A3' }
        : { line: 'Номера нет · добавьте в «Изменить»', ink: '#A3A3A3' },
      caption: phone
        ? 'Birka только откроет сообщение, а отправите его вы. Текст можно поправить.'
        : 'Birka откроет окно «Поделиться»: выберите, где написать Ивану. Текст можно поправить.',
      primary: phone ? 'ОТПРАВИТЬ SMS' : 'ПОДЕЛИТЬСЯ',
      hasSecondary: phone,
      sheet: { t: open ? 'translateY(0px)' : 'translateY(105%)', tr: 'transform ' + (open ? 460 : 300) + 'ms ' + sheetCurve },
      page: {
        t: open ? 'translateY(10px) scale(0.92)' : 'translateY(0px) scale(1)',
        r: open ? '24px' : '0px',
        tr: 'transform ' + (open ? 460 : 300) + 'ms ' + sheetCurve + ', border-radius ' + (open ? 460 : 300) + 'ms ' + sheetCurve
      },
      shade: { o: open ? '0.45' : '0', tr: 'opacity ' + (open ? 460 : 300) + 'ms ' + sheetCurve },
      send: () => {
        this.stop();
        this.setState({ open: false });
        this.later(1600, { open: true });
      },
      close: () => {
        this.stop();
        this.setState({ open: false });
        this.later(1600, { open: true });
      }
    };
  }
}
</script>
</body>
</html>
