<script type="text/x-dc" data-dc-script data-props='{"slow":{"editor":"boolean","default":false},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'month' };
    this.timer = null;
    this.start = 0;
    this.slowSeen = null;
    this.stopped = false;
  }

  componentDidMount() {
    this.stopped = false;
    this.clock();
  }

  componentDidUpdate() {
    this.clock();
  }

  componentWillUnmount() {
    this.stopped = true;
    clearTimeout(this.timer);
    this.timer = null;
  }

  steps() {
    return [['month', 1100, 860], ['tapWeek', 80, 140], ['week', 1100, 860], ['tapYear', 80, 140], ['year', 1300, 860], ['tapMonth', 80, 140]];
  }

  active() {
    return !this.stopped && (!this.__host || this.__host.logic === this);
  }

  phaseAt(elapsed) {
    const k = this.props.slow ? 3 : 1;
    const steps = this.steps();
    const total = steps.reduce((sum, s) => sum + s[1] + s[2] * k, 0);
    let t = elapsed % total;
    for (const s of steps) {
      const d = s[1] + s[2] * k;
      if (t < d) return s[0];
      t -= d;
    }
    return steps[0][0];
  }

  clock() {
    const slow = !!this.props.slow;
    if (slow !== this.slowSeen) {
      this.slowSeen = slow;
      this.start = Date.now();
    }
    if (this.timer || !this.active()) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (!this.active()) return;
      const phase = this.phaseAt(Date.now() - this.start);
      if (phase !== this.state.phase) this.setState({ phase });
      this.clock();
    }, 40);
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  renderVals() {
    this.clock();
    const k = this.props.slow ? 3 : 1;
    const reduced = this.props.reducedMotion ?? this.prefersReduced();
    const phase = this.state.phase;
    let period = 'month';
    if (phase === 'week' || phase === 'tapYear') period = 'week';
    if (phase === 'year' || phase === 'tapMonth') period = 'year';
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const ms = (x) => Math.round(x * k) + 'ms';
    const line = (p) => {
      const on = period === p;
      if (reduced) return { d: 0, o: on ? 1 : 0, tr: 'opacity ' + ms(220) + ' ease' };
      if (on) return { d: 0, o: 1, tr: 'opacity 0ms, stroke-dashoffset ' + ms(600) + ' ' + ease + ' ' + ms(120) };
      return { d: 900, o: 0, tr: 'opacity ' + ms(180) + ' ease, stroke-dashoffset 0ms linear ' + ms(220) };
    };
    const end = (p) => {
      const on = period === p;
      if (reduced) return { o: on ? 1 : 0, t: 'scale(1)', tr: 'opacity ' + ms(220) + ' ease' };
      if (on) return { o: 1, t: 'scale(1)', tr: 'opacity ' + ms(160) + ' ease ' + ms(620) + ', transform ' + ms(260) + ' ' + spring + ' ' + ms(620) };
      return { o: 0, t: 'scale(0.4)', tr: 'opacity ' + ms(120) + ' ease, transform ' + ms(120) + ' ease' };
    };
    const pos = { week: [0, 96], month: [106, 90], year: [206, 64] }[period];
    const dot = (on) => ({ o: on ? 1 : 0, t: on ? 'scale(1)' : 'scale(0.6)', tr: 'opacity ' + ms(140) + ' ease-out, transform ' + ms(140) + ' ease-out' });
    return {
      lm: line('month'),
      lw: line('week'),
      ly: line('year'),
      em: end('month'),
      ew: end('week'),
      ey: end('year'),
      pill: { l: pos[0], w: pos[1], tr: reduced ? 'none' : 'left ' + ms(560) + ' ' + spring + ', width ' + ms(560) + ' ' + spring },
      cw: period === 'week' ? '#0A0A0A' : '#D6D6D4',
      cm: period === 'month' ? '#0A0A0A' : '#D6D6D4',
      cy: period === 'year' ? '#0A0A0A' : '#D6D6D4',
      dw: { o: period === 'week' ? 1 : 0 },
      dm: { o: period === 'month' ? 1 : 0 },
      dy: { o: period === 'year' ? 1 : 0 },
      fade: 'opacity ' + ms(220) + ' ease',
      tapWeek: dot(phase === 'tapWeek'),
      tapMonth: dot(phase === 'tapMonth'),
      tapYear: dot(phase === 'tapYear')
    };
  }
}
</script>
