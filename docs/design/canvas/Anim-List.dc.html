<script type="text/x-dc" data-dc-script data-props='{"slow":{"editor":"boolean","default":false},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'rest' };
    this.timer = null;
    this.start = 0;
    this.slowSeen = null;
    this.stopped = false;
  }

  componentDidMount() {
    this.stopped = false;
    this.clock();
  }

  componentDidUpdate() {
    this.clock();
  }

  componentWillUnmount() {
    this.stopped = true;
    clearTimeout(this.timer);
    this.timer = null;
  }

  steps() {
    return [['rest', 1300, 0], ['tapPlus', 80, 140], ['added', 0, 560], ['addedCalm', 1260, 0], ['grab', 100, 140], ['swipe', 540, 360], ['deleted', 0, 560], ['deletedCalm', 960, 0]];
  }

  active() {
    return !this.stopped && (!this.__host || this.__host.logic === this);
  }

  phaseAt(elapsed) {
    const k = this.props.slow ? 3 : 1;
    const steps = this.steps();
    const total = steps.reduce((sum, s) => sum + s[1] + s[2] * k, 0);
    let t = elapsed % total;
    for (const s of steps) {
      const d = s[1] + s[2] * k;
      if (t < d) return s[0];
      t -= d;
    }
    return steps[0][0];
  }

  clock() {
    const slow = !!this.props.slow;
    if (slow !== this.slowSeen) {
      this.slowSeen = slow;
      this.start = Date.now();
    }
    if (this.timer || !this.active()) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      if (!this.active()) return;
      const phase = this.phaseAt(Date.now() - this.start);
      if (phase !== this.state.phase) this.setState({ phase });
      this.clock();
    }, 40);
  }

  prefersReduced() {
    try {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (error) {
      return false;
    }
  }

  renderVals() {
    this.clock();
    const k = this.props.slow ? 3 : 1;
    const reduced = this.props.reducedMotion ?? this.prefersReduced();
    const phase = this.state.phase;
    const shown = ['added', 'addedCalm', 'grab', 'swipe'].indexOf(phase) !== -1;
    const swiped = ['swipe', 'deleted', 'deletedCalm'].indexOf(phase) !== -1;
    const ease = 'cubic-bezier(0.2, 0, 0, 1)';
    const fade = 'cubic-bezier(0.42, 0, 0.58, 1)';
    const ms = (x) => Math.round(x * k) + 'ms';
    // A total takes the color of what its change means while it rolls, and
    // turns back once it settles: more spent is red, less spent is green.
    const news = phase === 'added' ? '#FF8E7F' : phase === 'deleted' ? '#3DDC97' : null;
    const colorTr = phase === 'rest' ? 'none' : 'color ' + ms(news ? 150 : 320) + ' ' + fade;
    const digits = shown ? [7, 7] : [3, 5];
    let taxiTr = 'height ' + ms(320) + ' ' + ease + ', margin-bottom ' + ms(320) + ' ' + ease + ', opacity ' + ms(240) + ' ' + ease + ' ' + ms(80);
    if (phase === 'deleted' || phase === 'deletedCalm') taxiTr = 'height ' + ms(260) + ' ' + ease + ' ' + ms(80) + ', margin-bottom ' + ms(260) + ' ' + ease + ' ' + ms(80) + ', opacity ' + ms(180) + ' ' + ease;
    if (reduced) taxiTr = 'opacity ' + ms(220) + ' ' + ease;
    const fingerOn = phase === 'grab' || phase === 'swipe';
    return {
      roll: reduced ? 'none' : 'transform ' + ms(520) + ' ' + ease,
      sum: { c: news || '#F4F4F2', tr: colorTr },
      day: { c: news || '#A3A3A3', tr: colorTr },
      sumH: { y: -22 * digits[0] },
      sumT: { y: -22 * digits[1] },
      dayH: { y: -16 * digits[0] },
      dayT: { y: -16 * digits[1] },
      taxi: { h: shown ? 66 : 0, mb: shown ? 10 : 0, o: shown ? 1 : 0, tr: taxiTr },
      row: { x: swiped ? -96 : 0, tr: phase === 'rest' || reduced ? 'none' : 'transform ' + ms(360) + ' ' + ease },
      finger: { x: swiped ? 184 : 280, o: fingerOn ? 1 : 0, tr: 'left ' + (phase === 'swipe' ? ms(360) : '0ms') + ' ' + ease + ', opacity ' + ms(140) + ' ease-out' },
      tapPlus: { o: phase === 'tapPlus' ? 1 : 0, t: phase === 'tapPlus' ? 'scale(1)' : 'scale(0.6)', tr: 'opacity ' + ms(140) + ' ease-out, transform ' + ms(140) + ' ease-out' }
    };
  }
}
</script>
